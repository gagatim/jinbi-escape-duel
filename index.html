<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>禁閉逃殺 雙人對決</title>
<style>
:root{
  --bg:#14110f; --panel:#1f1a17; --panel2:#2a231f; --line:#3d332c; --text:#eee3d6; --muted:#a8998a;
  --ember:#e0703a; --ember-bright:#ff9a5c; --poison:#7d4bc4; --poison-bg:rgba(125,75,196,.28);
  --cyan:#7fe3f5; --ink:var(--text); --good:#5fc27a; --bad:#e2554d; --gold:#e8c35a; --me:#3fa7e0; --opp:#e0703a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
.btn{background:var(--ember);color:#1a0f08;border:0;border-radius:8px;padding:8px 14px;font-weight:700}
.btn:hover{background:var(--ember-bright)}
.btn:disabled{background:#4a3f37;color:#857868;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ember)}
.btn.small{padding:4px 10px;font-size:13px;border-radius:6px}
input,select{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.wrap{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:22px;margin:4px 0 12px;letter-spacing:2px}
h1 small{font-size:13px;color:var(--muted);letter-spacing:0;margin-left:8px}
h3{margin:0 0 8px;font-size:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.muted{color:var(--muted)}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* lobby */
.lobby{max-width:460px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
.lobby .panel{display:flex;flex-direction:column;gap:10px}
.code{font-size:28px;letter-spacing:6px;font-weight:800;color:var(--gold);text-align:center}
/* top bar */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pcard.me{border-color:var(--me)} .pcard.opp{border-color:var(--opp)}
.pcard .nm{font-weight:800}
.pcard.me .nm{color:var(--me)} .pcard.opp .nm{color:var(--opp)}
.hpbar{height:8px;background:#3a2f29;border-radius:4px;overflow:hidden;margin:4px 0}
.hpbar i{display:block;height:100%;background:var(--good)}
.stats{font-size:13px;color:var(--muted)}
.stats b{color:var(--text)}
.roundbox{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6px 14px;background:var(--panel2);border-radius:10px;border:1px solid var(--line);min-width:120px;text-align:center}
.roundbox .rn{font-size:20px;font-weight:800}
.roundbox .ph{font-size:12px;color:var(--muted)}
/* main */
.main{display:grid;grid-template-columns:1fr 1fr 340px;gap:12px}
.bld h3 .tag{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.floor{display:grid;grid-template-columns:38px 1fr;gap:6px;align-items:center;padding:4px 6px;border-radius:6px;border:1px solid transparent;margin-bottom:3px;min-height:40px;position:relative}
.floor .fl{font-weight:800;color:var(--muted);text-align:center}
.floor.poison{background:var(--poison-bg);border-color:var(--poison)}
.floor.poison .fl{color:#c9a6ff}
.floor.here{border-color:var(--me);box-shadow:0 0 0 1px var(--me) inset}
.bld.opp .floor.here{border-color:var(--opp);box-shadow:0 0 0 1px var(--opp) inset}
.floor.target{outline:2px dashed var(--ember)}
.rooms{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.room{font-size:12.5px;padding:3px 8px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.room.click{cursor:pointer;border-color:var(--ember)}
.room.click:hover{background:var(--ember);color:#1a0f08}
.room.in{background:var(--me);color:#06141c;border-color:var(--me);font-weight:700}
.room.locked{opacity:.45}
.tok{font-size:12px;font-weight:800;border-radius:10px;padding:1px 7px;margin-left:auto}
.tok.me{background:var(--me);color:#06141c}
.tok.opp{background:var(--opp);color:#1a0f08}
.tok.ghost{background:#777;color:#111}
.skull{font-size:11px;color:#c9a6ff;margin-left:4px}
.side{display:flex;flex-direction:column;gap:12px}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.card{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.card .x{cursor:pointer;color:var(--muted);margin-left:2px}
.card .x:hover{color:var(--bad)}
.card.weapon{border-color:#b2643a}
.card.special{border-color:#7d64c8}
/* 背包道具圖示：與抽卡同一套 SVG，顏色依稀有度／種類 */
.card .ci{--c:var(--cyan);width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--c);
  background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--c) 38%,#1a2236) 0%,#0c1322 78%);border:1.5px solid color-mix(in srgb,var(--c) 75%,transparent)}
.card .ci svg{width:16px;height:16px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.card.t-rare{border-color:#c9a23a} .card.t-rare .ci{--c:#ffd45e;box-shadow:0 0 6px rgba(255,201,74,.55)}
.card.t-trash .ci{--c:#9aa0a5;filter:grayscale(1)}
.card.i-water .ci{--c:#5eb4ff} .card.i-food .ci{--c:#c9a46a} .card.i-wine .ci{--c:#d9577a} .card.i-pill .ci{--c:#6fe0ac}
.card.i-rocket .ci{--c:#ff5a36} .card.i-dimpocket .ci{--c:#b57bff} .card.i-recycle .ci{--c:#4cd07a} .card.i-rope .ci{--c:#e0a24a} .card.i-gasmask .ci{--c:#35d0c0}
.log{max-height:260px;overflow:auto;font-size:13px}
.log div{padding:2px 0;border-bottom:1px dashed #2f2722}
.log .pv{color:#9fd0ef}
.log .rd{color:var(--gold);font-weight:700}
.steps{font-size:13px}
.steps b{font-size:18px;color:var(--gold)}
.notice{background:#2c2018;border:1px solid #5a3a26;border-radius:8px;padding:8px 10px;font-size:13.5px}
/* modal */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--ember);border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.pickgrid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pick{padding:8px 10px;border-radius:8px;background:var(--panel2);border:2px solid var(--line);cursor:pointer;min-width:84px;text-align:center}
.pick.on{border-color:var(--good);background:#1f3326}
.pick small{display:block;color:var(--muted);font-size:11px}
.statrow{display:grid;grid-template-columns:70px 36px 50px 36px 1fr;gap:6px;align-items:center;margin:6px 0}
.statrow .v{text-align:center;font-size:20px;font-weight:800}
.report div{padding:3px 0;border-bottom:1px dashed #2f2722}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#3a1d18;border:1px solid var(--bad);padding:8px 16px;border-radius:8px;z-index:99}
.rules{font-size:13px;color:var(--muted)}
.rules b{color:var(--text)}

/* ===== 抽卡翻牌（移植自原版禁閉逃殺）===== */
  .flipRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0;perspective:800px}
  .flipCard{width:88px;height:140px;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.9,.3,1);cursor:pointer}
  .flipCard.flipped{transform:rotateY(180deg)}
  .flipFace{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:700;font-size:15px;padding:6px}
  .flipBack{background:radial-gradient(circle at 50% 38%,#2a6378 0%,#14303f 55%,#0a1824 100%);border:2px solid #4d9db3;box-shadow:inset 0 0 14px rgba(0,0,0,.55)}
  .flipBack::before{content:"";position:absolute;inset:5px;border:1px solid rgba(127,227,245,.55);border-radius:6px}
  .flipBack::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 48%,transparent 60%)}
  .flipEmblem{position:relative;width:34px;height:34px;transform:rotate(45deg);border:2px solid #7fe3f5;border-radius:4px;display:flex;align-items:center;justify-content:center;background:rgba(127,227,245,.08);box-shadow:0 0 10px rgba(127,227,245,.45)}
  .flipEmblem i{transform:rotate(-45deg);font-style:normal;color:#bff3fb;font-size:18px;line-height:1}
  .flipFront{transform:rotateY(180deg);color:var(--ink);background:linear-gradient(160deg,var(--panel) 30%,color-mix(in srgb,var(--cyan) 16%,var(--panel)) 100%);border:2px solid var(--line)}
  .flipFront .nm{font-size:16px;letter-spacing:.04em}
  .flipFront .tag{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--muted);border-top:1px solid var(--line);padding-top:4px;width:70%}
  .flipCard.rare .flipFront{background:linear-gradient(160deg,rgba(255,201,74,.22) 0%,var(--panel) 70%);border-color:#ffc94a;box-shadow:0 0 14px 3px rgba(255,201,74,.75);animation:rareGlow 1.1s ease-in-out infinite alternate}
  .flipCard.rare .flipFront .tag{color:#ffc94a;border-color:#ffc94a}
  @keyframes rareGlow{from{box-shadow:0 0 8px 1px rgba(255,201,74,.5)}to{box-shadow:0 0 20px 6px rgba(255,201,74,.95)}}
  /* 抽卡三階：垃圾（灰）／普通（青藍，預設）／稀有（金，多一層掃光＋閃爍星點＋圖示脈動） */
  .flipFront .ic{font-size:30px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
  .flipFront .ic{color:var(--cyan)} .flipFront .ic svg{width:36px;height:36px;display:block}
  .flipCard.trash .flipFront .ic{color:#9aa0a5} .flipCard.rare .flipFront .ic{color:#ffd45e} .flipCard.sp .flipFront .ic{color:var(--sp)}
  .flipCard.trash .flipFront{background:linear-gradient(160deg,#4a4e52 0%,#2b2e31 100%);border-color:#6b7075;color:#aeb3b8}
  .flipCard.trash .flipFront .tag{color:#8c9196;border-color:#5a5f64}
  .flipCard.trash .flipFront .ic{filter:grayscale(1) opacity(.8)}
  .flipCard.rare .flipFront{border-width:3px}
  .flipCard.rare .flipFront .ic{animation:rareIconPulse 1.1s ease-in-out infinite alternate;filter:drop-shadow(0 0 6px rgba(255,201,74,.95))}
  .flipCard.rare .flipFront .nm{color:#ffe08a;text-shadow:0 0 6px rgba(255,201,74,.7)}
  .flipCard.rare .flipFront::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,244,200,.55) 48%,transparent 66%);transform:translateX(-120%);animation:rareSweep 1.8s ease-in-out infinite;pointer-events:none}
  .flipCard.rare .flipFront::after{content:"✦";position:absolute;top:4px;right:7px;color:#ffe08a;font-size:13px;line-height:1;text-shadow:0 0 6px rgba(255,201,74,.9);pointer-events:none;animation:rareTwinkle 1.2s ease-in-out infinite alternate}
  /* 垃圾場五件奇物：各自一種主色＋專屬動態（火箭筒火紅閃動／次元口袋紫色漩渦／循環回收裝置綠色旋轉／繩索琥珀掃光／防毒面具青綠霧氣） */
  .flipCard.sp .flipFront{border-width:3px;border-color:var(--sp);background:linear-gradient(160deg,color-mix(in srgb,var(--sp) 26%,var(--panel)) 0%,var(--panel) 75%);box-shadow:0 0 12px 2px color-mix(in srgb,var(--sp) 70%,transparent)}
  .flipCard.sp .flipFront .tag{color:var(--sp);border-color:var(--sp)}
  .flipCard.sp .flipFront .nm{color:var(--sp);text-shadow:0 0 6px color-mix(in srgb,var(--sp) 60%,transparent)}
  .flipCard.sp .flipFront .ic{filter:drop-shadow(0 0 6px var(--sp))}
  .flipCard.sp-rocket{--sp:#ff5a36} .flipCard.sp-dimpocket{--sp:#b57bff} .flipCard.sp-recycledevice{--sp:#4cd07a}
  .flipCard.sp-rope{--sp:#e0a24a} .flipCard.sp-gasmask{--sp:#35d0c0}
  .flipCard.sp-rocket .flipFront{animation:spFlicker .35s steps(2) infinite alternate}
  .flipCard.sp-dimpocket .flipFront::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(181,123,255,.45) 85%,transparent 100%);animation:spSpin 2.4s linear infinite;pointer-events:none}
  .flipCard.sp-recycledevice .flipFront .ic{animation:spSpin 3s linear infinite}
  .flipCard.sp-rope .flipFront::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(224,162,74,.18) 8px 12px);animation:spSlide 1.6s linear infinite;pointer-events:none}
  .flipCard.sp-gasmask .flipFront::before{content:"";position:absolute;left:-20%;right:-20%;bottom:-10%;height:55%;background:radial-gradient(ellipse at 50% 100%,rgba(53,208,192,.5),transparent 70%);animation:spMist 1.8s ease-in-out infinite alternate;pointer-events:none}
  @keyframes spFlicker{from{box-shadow:0 0 8px 1px rgba(255,90,54,.5)}to{box-shadow:0 0 22px 6px rgba(255,140,60,.95)}}
  @keyframes spSpin{to{transform:rotate(360deg)}}
  @keyframes spSlide{to{background-position:24px 24px}}
  @keyframes spMist{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:translateY(-4px)}}

  /* 圖示質感：圓形徽章（高光＋內陰影＋色環）＋金屬漸層圖形＋深色描邊 */
  .flipFront .ic{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0;
    background:radial-gradient(circle at 34% 28%,color-mix(in srgb,currentColor 38%,#1a2236) 0%,#0c1322 78%);
    border:2px solid color-mix(in srgb,currentColor 75%,transparent);
    box-shadow:inset 0 2px 5px rgba(255,255,255,.14),inset 0 -6px 10px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.45)}
  .flipFront .ic svg{width:34px;height:34px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.65))}
  .flipCard.sp-recycledevice .flipFront .ic{animation:none}
  .flipCard.sp-recycledevice .flipFront .ic svg{animation:spSpin 3s linear infinite}



  /* 酒：酒紅色／藥片：薄荷綠 */
  .flipCard.wine .flipFront{border-color:#a8324f;background:linear-gradient(160deg,color-mix(in srgb,#a8324f 30%,var(--panel)) 0%,var(--panel) 80%)}
  .flipCard.wine .flipFront .ic{color:#d9577a}
  .flipCard.wine .flipFront .nm{color:#e0728f}
  .flipCard.wine .flipFront .tag{color:#c24a68;border-color:#a8324f}
  .flipCard.pill .flipFront{border-color:#3fae7d;background:linear-gradient(160deg,color-mix(in srgb,#3fae7d 28%,var(--panel)) 0%,var(--panel) 80%)}
  .flipCard.pill .flipFront .ic{color:#6fe0ac}
  .flipCard.pill .flipFront .nm{color:#82e6b9}
  .flipCard.pill .flipFront .tag{color:#58c795;border-color:#3fae7d}
  /* 水：清澈的天藍色（比預設的青藍更藍、更亮） */
  .flipCard.water .flipFront{border-color:#3d8fe0;background:linear-gradient(160deg,color-mix(in srgb,#3d8fe0 30%,var(--panel)) 0%,var(--panel) 80%)}
  .flipCard.water .flipFront .ic{color:#5eb4ff}
  .flipCard.water .flipFront .nm{color:#6bbcff}
  .flipCard.water .flipFront .tag{color:#5aa6e8;border-color:#3d8fe0}
  /* 糧食：暗土色（土褐）。只換顏色，不加動態，維持「普通」階級的樸素感 */
  .flipCard.food .flipFront{border-color:#8a6a43;background:linear-gradient(160deg,color-mix(in srgb,#8a6a43 30%,var(--panel)) 0%,var(--panel) 80%)}
  .flipCard.food .flipFront .ic{color:#c9a46a}
  .flipCard.food .flipFront .nm{color:#c9a46a}
  .flipCard.food .flipFront .tag{color:#a58558;border-color:#8a6a43}
  @keyframes rareSweep{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
  @keyframes rareTwinkle{from{opacity:.25}to{opacity:1}}
  @keyframes rareIconPulse{from{transform:scale(1)}to{transform:scale(1.18)}}
  .flipCard.pickable{cursor:pointer}
  .flipCard.chosen .flipFront{outline:3px solid var(--good);outline-offset:2px}
  .flipCard.chosen::after{content:"✔";position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#0b1a10;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:2;transform:rotateY(180deg)}
  .modal{animation:modalPop .18s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes modalPop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .credit{position:fixed;right:12px;bottom:8px;z-index:40;font-size:12px;color:var(--muted);background:rgba(20,17,15,.85);border:1px solid var(--line);border-radius:6px;padding:3px 9px;pointer-events:none}
  .sndBtn{position:fixed;top:10px;right:12px;z-index:60;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:3px 9px}
@media (max-width:980px){
  .main{grid-template-columns:1fr}
  .topbar{grid-template-columns:1fr 1fr}
  .roundbox{grid-column:1/3;grid-row:1}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>禁閉逃殺 雙人對決<small id="netStat"></small></h1>
  <div id="app"></div>
</div>
<div id="modalRoot"></div>
<button class="sndBtn" id="sndBtn" title="音效開關">🔊</button>
<div class="credit">小葉設計　未經允許　請勿使用</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

<!-- ===================== ENGINE（純邏輯，不碰 DOM；只在房主端執行）===================== -->
<script id="engine">
const MAXHP=10, ROUNDS=6, STAT_POINTS=10;
const FLOORS=["2F","1F","B1","B2","B3","B4","B5","B6","B7"];
const POISON_DMG=[1,2,2,3,3,4]; // 第1~6回合毒氣傷害
const AIRDROP=["knifeX2","wine","waterfood","pistol","adrenaline","pill"]; // 停機坪第1~6回合空投
const START_FLOORS=[1,2,3]; // 開局可選 1F／B1／B2
const TELEPORT_FLOOR=5, WAREHOUSE_FLOOR=6, MORGUE_FLOOR=8;
const ITEMS={
  water:{n:"水",ic:"💧",d:"飢餓結算時自動支付"},
  food:{n:"糧食",ic:"🍞",d:"飢餓結算時自動支付"},
  waterfood:{n:"生存補給",ic:"🎒",d:"一張卡同時抵1水+1糧"},
  pill:{n:"藥片",ic:"💊",d:"結算時使用：回復2血"},
  adrenaline:{n:"腎上腺素",ic:"💉",d:"結算時使用：本回合血量最低保留1血，避免死亡"},
  wine:{n:"酒",ic:"🍷",d:"結算時使用，擲骰：1丟光道具／2無事／3武力+1／4速度+1／5負重+1／6回2血"},
  gold:{n:"金條",ic:"🪙",d:"在可搜索的房間花1根多抽1張隨機卡（每回合1次）；遊戲結束時每根+1血"},
  knife:{n:"刀",ic:"🔪",w:2,d:"武力+2"},
  knifeX2:{n:"雙刀",ic:"⚔️",w:4,d:"武力+4"},
  pistol:{n:"手槍",ic:"🔫",w:2,gun:true,d:"武力+2；持槍時無視對方武力，直接造成自己全部武力的傷害"},
  shotgun:{n:"霰彈槍",ic:"💥",w:4,gun:true,d:"武力+4；持槍時無視對方武力，直接造成自己全部武力的傷害"},
  rope:{n:"繩索",ic:"🪢",sp:true,d:"移動速度+2"},
  dimpocket:{n:"次元口袋",ic:"👝",sp:true,d:"負重無上限"},
  rocket:{n:"火箭筒",ic:"🚀",sp:true,d:"每回合可發射1次：指定對方一個樓層，結算時對方在該樓層扣4血（永久持有，不會消耗）"},
  gasmask:{n:"防毒面具",ic:"😷",sp:true,d:"毒氣傷害-2（最低0），不會消耗"},
  recycle:{n:"回收裝置",ic:"♻️",sp:true,d:"從棄牌堆隨機拿回1張用過的道具（每回合1次）"},
  trash:{n:"垃圾",ic:"🗑️",d:"沒有用途"}
};
// f: 樓層索引（0=2F … 8=B7）。draw: 翻開幾張；keep: 最多留幾張（預設全部可留，仍受負重限制）
const ROOMS={
  gene:{n:"基因庫",f:0,type:"gene",d:"力量／速度／負重各永久+1，扣2血"},
  heli:{n:"停機坪",f:1,draw:99,d:"每回合空投：雙刀→酒→生存補給→手槍→腎上腺素→藥片（沒人拿會累積）"},
  tower:{n:"水塔",f:1,draw:4,d:"抽4張水（共10個）"},
  control:{n:"控制室",f:2,type:"control",d:"解除自己大樓一層毒氣，或對方大樓多一層毒氣"},
  armory:{n:"武器庫",f:2,draw:2,d:"抽2張（5刀、2手槍、1霰彈槍）"},
  canteen:{n:"餐廳",f:3,type:"canteen",d:"本回合不用支付水糧"},
  vault:{n:"金庫",f:3,draw:2,d:"抽2張金條（共4條）"},
  ops:{n:"操作室",f:4,type:"respec",d:"重新分配力量／速度／負重"},
  pharmacy:{n:"藥房",f:4,draw:2,d:"抽2張（3藥片、3腎上腺素）"},
  teleport:{n:"傳送室",f:5,type:"teleport",d:"移動時花2步傳送到任意樓層（一場最多2次）；傳送到B5可開大倉庫"},
  dump:{n:"垃圾場",f:6,draw:5,keep:2,noGold:true,d:"翻5張，奇物（繩索、次元口袋、火箭筒、防毒面具、回收裝置）最多帶走2件；另有20個垃圾"},
  granary:{n:"糧倉",f:6,draw:10,d:"抽10張糧食（共10個）"},
  warehouse:{n:"大倉庫",f:6,draw:3,needTP:true,d:"須從B4傳送到B5才能進入；抽3張"},
  cellar:{n:"酒窖",f:7,draw:2,d:"抽2張酒（共6個）"},
  morgue:{n:"停屍間",f:8,draw:3,d:"死亡玩家的遺物在這裡；抽3張"}
};
function initialStock(){
  return {
    heli:{}, tower:{water:10}, armory:{knife:5,pistol:2,shotgun:1}, vault:{gold:4},
    pharmacy:{pill:3,adrenaline:3},
    dump:{trash:20,rope:1,dimpocket:1,rocket:1,gasmask:1,recycle:1},
    granary:{food:10}, cellar:{wine:6}, morgue:{},
    warehouse:{water:4,food:4,knife:3,wine:2,pill:2,adrenaline:2,pistol:1,gold:1,shotgun:1}
  };
}
function newPlayer(name,id){
  return {id,name,hp:MAXHP,power:0,speed:0,carry:0,ready:false,inv:[],floor:1,room:null,
    alive:true,drain:0,deathRound:0,deathPower:0,deathCause:"",ghostSpeed:1,tpLeft:2,t:{},mem:{took:{},exact:{}}};
}
function newGame(names){
  return {v:1,round:0,phase:"setup",players:names.map((n,i)=>newPlayer(n,i)),
    opts:{},first:null,dice:null,stock:initialStock(),poison:[[],[]],discard:[],log:[],report:[],reveal:[null,null],revealRound:[0,0],result:null,rand:Math.random};
}
// ---------- helpers ----------
const opp=pi=>1-pi;
const count=(p,it)=>p.inv.filter(x=>x===it).length;
const has=(p,it)=>p.inv.includes(it);
function takeItem(p,it){ const i=p.inv.indexOf(it); if(i<0) return false; p.inv.splice(i,1); return true; }
function carryCap(p){ return has(p,"dimpocket")?Infinity:p.carry; }
function carryRoom(p){ return carryCap(p)-p.inv.length; }
function combatPower(p){ return p.power+p.inv.reduce((s,it)=>s+(ITEMS[it].w||0),0); }
function hasGun(p){ return p.inv.some(it=>ITEMS[it].gun); }
function moveSpeed(p){ return p.speed+(has(p,"rope")?2:0); }
function stockTotal(s){ return Object.values(s).reduce((a,b)=>a+b,0); }
// 對手看得到的位置：只有戰鬥、暗影吸血、被火箭筒命中、死亡時才更新
function reveal(G,p){ G.reveal[p.id]=p.floor; G.revealRound[p.id]=G.round; }
// 房間庫存對玩家與 AI 都是未知的。每位玩家只記得：自己拿走過什麼、親眼看到房間被翻空時剩下什麼。
// AI 用這份記憶加上開局配置（規則公開）來推測庫存，見 stockGuess。
function memOf(p){ return p.mem||(p.mem={took:{},exact:{}}); }
function noteTook(p,room,it){ const m=memOf(p).took; const r=m[room]||(m[room]={}); r[it]=(r[it]||0)+1; }
function deathCount(G){ return G.players.filter(q=>q.deathRound>0).length; }
function noteExact(G,p,room,cards){ const o={}; cards.forEach(c=>{ o[c]=(o[c]||0)+1; }); memOf(p).exact[room]={s:o,r:G.round,d:deathCount(G)}; }
function stockGuess(G,p,room){
  const m=memOf(p), ex=m.exact[room], out={};
  const addTo=(o,k,n)=>{ o[k]=(o[k]||0)+n; };
  if(room==="heli"){ // 空投時程是公開的：最後一次看到的內容＋之後的空投
    const from=ex?ex.r:0;
    if(ex) Object.keys(ex.s).forEach(k=>addTo(out,k,ex.s[k]));
    AIRDROP.slice(from,G.round).forEach(k=>addTo(out,k,1));
    if(!ex) Object.keys(m.took.heli||{}).forEach(k=>{ out[k]=Math.max(0,(out[k]||0)-m.took.heli[k]); });
    return out;
  }
  if(room==="morgue"){
    if(ex && ex.d===deathCount(G)) return Object.assign({},ex.s);
    return deathCount(G)?{water:1,food:1,knife:1}:{};
  }
  if(ex) return Object.assign({},ex.s);
  const init=initialStock()[room]||{}, took=m.took[room]||{};
  Object.keys(init).forEach(k=>{ out[k]=Math.max(0,init[k]-(took[k]||0)); });
  return out;
}
// 讓該玩家的畫面播一次翻牌（只給自己看）
function flash(G,p,title,items){ p.flash={id:String(G.rand()).slice(2,12),r:G.round,title,items}; }
function log(G,text,to){ G.log.push({r:G.round,text,to}); }
function fl(f){ return FLOORS[f]; }
function fail(msg){ throw new Error(msg); }
function shuffle(a,rand){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startRound(G){
  G.round++; G.phase="action"; G.report=[];
  const drop=AIRDROP[G.round-1];
  if(drop){ G.stock.heli[drop]=(G.stock.heli[drop]||0)+1; }
  // 擲骰比大小決定先後（同點重擲）：後手要等先手結束回合才能搜索房間
  G.first=null; G.dice=null;
  if(G.opts && G.opts.dice){
    const rolls=[]; let a,b;
    do{ a=1+Math.floor(G.rand()*6); b=1+Math.floor(G.rand()*6); rolls.push([a,b]); }while(a===b);
    G.first=a>b?0:1; G.dice=rolls;
  }
  log(G,"── 第 "+G.round+" 回合開始 ── 停機坪空投："+ITEMS[drop].ic+ITEMS[drop].n+"；本回合毒氣傷害 "+POISON_DMG[G.round-1]);
  G.players.forEach(p=>{
    p.t={poison:null,steps:p.alive?moveSpeed(p):p.ghostSpeed,committed:false,roomUsed:false,pending:null,
      canteen:false,wh:false,recycled:false,goldUsed:false,rockets:[],ctrlAdd:null,ctrlDetox:null,ended:false,itemsDone:true,startFloor:p.floor,mustMove:(p.alive?moveSpeed(p):p.ghostSpeed)>0};
    p.room=null; p.ready=false;
    // 行動階段對手看到的血量／素質：回合開始時的快照（避免從即時變化推測位置，例如基因庫扣血）
    p.pub={hp:p.hp,power:p.power,speed:p.speed,carry:p.carry,alive:p.alive,drain:p.drain};
  });
  if(G.dice) log(G,"🎲 擲骰比大小："+G.dice.map(([a,b])=>G.players[0].name+" "+a+" vs "+G.players[1].name+" "+b).join("（同點重擲）→ ")+"，"+G.players[G.first].name+" 先行動");
}
// 後手在先手結束回合前不能搜索房間／用金條
function waitingFirst(G,pi){ return G.first!==null && G.first!==undefined && G.first!==pi && !G.players[G.first].t.ended; }

// ---------- 動作入口 ----------
function apply(G,pi,a,x){
  x=x||{};
  const p=G.players[pi], t=p.t;
  if(a==="setup"){
    if(G.phase!=="setup") fail("不在配點階段");
    const v=[x.power,x.speed,x.carry].map(n=>Math.floor(Number(n)));
    if(v.some(n=>!(n>=0))) fail("數值不正確");
    if(v[0]+v[1]+v[2]!==STAT_POINTS) fail("必須剛好分配 "+STAT_POINTS+" 點");
    if(v[1]<1) fail("速度最低 1 點");
    const sf=x.floor|0;
    if(!START_FLOORS.includes(sf)) fail("起始樓層只能選 1F、B1、B2");
    [p.power,p.speed,p.carry]=v; p.floor=sf; p.ready=true;
    if(x.name) p.name=String(x.name).slice(0,12);
    log(G,p.name+" 完成配點與起始位置選擇。");
    if(G.players.every(q=>q.ready)) openingEncounter(G);
    return;
  }
  if(a==="rematch"){
    if(G.phase!=="end") fail("遊戲尚未結束");
    const fresh=newGame(G.players.map(q=>q.name)); fresh.opts=G.opts||{};
    Object.keys(G).forEach(k=>delete G[k]); Object.assign(G,fresh);
    return;
  }
  if(a==="ready"){
    if(G.phase!=="report") fail("目前不需要確認");
    p.ready=true;
    if(G.players.every(q=>q.ready)){ if(G.round>=ROUNDS) endGame(G); else startRound(G); }
    return;
  }
  if(a==="useItems") return useItems(G,pi,x);
  if(G.phase!=="action") fail("現在不是行動階段");
  if(t.ended) fail("你已結束本回合");
  switch(a){
    case "poison": {
      if(t.poison!==null) fail("本回合已經投過毒");
      if(x.floor===-1){ t.poison=-1; log(G,"你本回合不投毒。",pi); return; }
      const f=x.floor|0;
      if(f<0||f>8) fail("樓層不正確");
      if(G.poison[opp(pi)].includes(f)) fail("那層已經有毒氣");
      t.poison=f; log(G,"你對 "+G.players[opp(pi)].name+" 的大樓 "+fl(f)+" 投毒（結算時生效）。",pi);
      return;
    }
    case "move": {
      if(t.poison===null) fail("請先投毒（或選擇不投毒）");
      if(t.committed) fail("已經停留在房間，不能再移動");
      if(t.steps<1) fail("沒有剩餘步數");
      const nf=p.floor+(x.dir<0?-1:1);
      if(nf<0||nf>8) fail("已經到頂／到底了");
      p.floor=nf; t.steps--; t.wh=false;
      return;
    }
    case "teleport": {
      if(!p.alive) fail("暗影不能使用傳送室");
      if(t.poison===null) fail("請先投毒（或選擇不投毒）");
      if(t.committed) fail("已經停留在房間");
      if(p.floor!==TELEPORT_FLOOR) fail("要在 B4 傳送室才能傳送");
      if(p.tpLeft<1) fail("本場傳送次數已用完");
      if(t.steps<2) fail("傳送需要2步");
      const f=x.floor|0;
      if(f<0||f>8||f===p.floor) fail("目的樓層不正確");
      p.floor=f; t.steps-=2; p.tpLeft--;
      t.wh=(f===WAREHOUSE_FLOOR);
      log(G,"你從傳送室傳送到 "+fl(f)+(t.wh?"，大倉庫的門開了！":"")+"（本場剩 "+p.tpLeft+" 次）",pi);
      return;
    }
    case "enter": {
      if(!p.alive) fail("暗影不能進房間");
      if(t.poison===null) fail("請先投毒（或選擇不投毒）");
      if(t.committed) fail("已經停留在房間");
      if(x.room){
        const R=ROOMS[x.room];
        if(!R || R.f!==p.floor) fail("這個房間不在你所在的樓層");
        if(R.needTP && !t.wh) fail("大倉庫只有從 B4 傳送過來才能進入");
        if(t.mustMove && p.floor===t.startFloor) fail("每回合不能停留在出發的樓層，請先移動");
        p.room=x.room;
      } else p.room=null;
      t.committed=true;
      return;
    }
    case "room":
      if(waitingFirst(G,pi)) fail("本回合由 "+G.players[G.first].name+" 先行動，等他結束回合後才能使用房間");
      return roomAction(G,pi,x);
    case "keep": return keepCards(G,pi,x);
    case "gold": {
      if(!t.committed || !p.room) fail("要先停留在房間");
      const R=ROOMS[p.room];
      if(!R.draw || R.noGold) fail("這個房間不能用金條");
      if(waitingFirst(G,pi)) fail("本回合由 "+G.players[G.first].name+" 先行動，等他結束回合後才能用金條");
      if(t.pending) fail("請先處理抽到的卡");
      if(t.goldUsed) fail("金條每回合限用1次");
      if(!has(p,"gold")) fail("你沒有金條");
      const s=G.stock[p.room], deck=[];
      Object.keys(s).forEach(k=>{ if(k!=="gold") for(let i=0;i<s[k];i++) deck.push(k); });
      if(carryCap(p)-(p.inv.length-1)<1) fail("負重不足");
      if(!deck.length){ noteExact(G,p,p.room,[]); t.goldUsed=true; log(G,"你想用金條在「"+R.n+"」多抽一張，但已經沒有東西了（金條沒有花掉）。",pi); return; }
      const it=deck[Math.floor(G.rand()*deck.length)];
      takeItem(p,"gold"); G.discard.push("gold"); s[it]--; p.inv.push(it); t.goldUsed=true; noteTook(p,p.room,it);
      flash(G,p,"用金條多抽",[it]);
      log(G,"你用1根金條在「"+R.n+"」多抽到 "+ITEMS[it].n+"。",pi);
      return;
    }
    case "recycle": {
      if(!p.alive) fail("暗影不能使用道具");
      if(!has(p,"recycle")) fail("你沒有回收裝置");
      if(t.recycled) fail("回收裝置每回合限用1次");
      if(!G.discard.length) fail("棄牌堆是空的");
      if(carryRoom(p)<1) fail("負重已滿");
      const i=Math.floor(G.rand()*G.discard.length), it=G.discard.splice(i,1)[0];
      p.inv.push(it); t.recycled=true;
      flash(G,p,"回收裝置拿回",[it]);
      log(G,"你使用回收裝置，從棄牌堆拿回 "+ITEMS[it].n+"。",pi);
      return;
    }
    case "rocket": {
      if(!p.alive) fail("暗影不能使用道具");
      const f=x.floor|0;
      if(f<0||f>8) fail("樓層不正確");
      if(!has(p,"rocket")) fail("你沒有火箭筒");
      if(t.rockets.length) fail("火箭筒每回合只能發射1次");
      t.rockets.push(f); // 永久持有：發射後火箭筒留在背包
      log(G,"你用火箭筒瞄準 "+G.players[opp(pi)].name+" 大樓的 "+fl(f)+"（結算時命中扣4血）。",pi);
      return;
    }
    case "drop": {
      if(!p.alive) fail("暗影沒有道具");
      const i=x.idx|0;
      if(i<0||i>=p.inv.length) fail("道具不存在");
      if(p.inv[i]==="dimpocket" && p.inv.length-1>p.carry) fail("丟掉次元口袋後會超過負重（"+p.carry+"），請先丟掉其他道具");
      const it=p.inv.splice(i,1)[0]; G.discard.push(it);
      log(G,"你丟掉了 "+ITEMS[it].n+"。",pi);
      return;
    }
    case "endTurn": {
      if(t.poison===null) fail("請先投毒（或選擇不投毒）");
      if(t.pending) fail("請先處理抽到的卡");
      if(t.mustMove && p.floor===t.startFloor) fail("每回合不能停留在出發的樓層（"+fl(p.floor)+"），請先移動");
      if(!t.committed && p.alive){ t.committed=true; p.room=null; }
      t.ended=true;
      if(G.players.every(q=>q.t.ended)) settle(G);
      return;
    }
  }
  fail("未知動作："+a);
}

function roomAction(G,pi,x){
  const p=G.players[pi], t=p.t;
  if(!t.committed || !p.room) fail("要先停留在房間");
  if(t.roomUsed) fail("這回合已經使用過房間");
  const R=ROOMS[p.room];
  if(R.draw){
    const s=G.stock[p.room], deck=[];
    Object.keys(s).forEach(k=>{ for(let i=0;i<s[k];i++) deck.push(k); });
    if(!deck.length){
      t.roomUsed=true; noteExact(G,p,p.room,[]);
      log(G,"你搜索了「"+R.n+"」，但裡面已經空了。",pi);
      return;
    }
    shuffle(deck,G.rand);
    const cards=deck.slice(0,R.draw);
    cards.forEach(c=>s[c]--);
    t.pending={room:p.room,cards,keep:R.keep||99}; t.roomUsed=true;
    return;
  }
  if(R.type==="gene"){
    p.power++; p.speed++; p.carry++; p.hp-=2; t.roomUsed=true;
    log(G,"你使用基因庫：力量／速度／負重各+1，扣2血（HP "+p.hp+"）。",pi);
    return;
  }
  if(R.type==="canteen"){
    t.canteen=true; t.roomUsed=true;
    log(G,"你在餐廳飽餐一頓，本回合不用支付水糧。",pi);
    return;
  }
  if(R.type==="control"){
    const f=x.floor|0;
    if(x.mode==="detox"){
      if(!G.poison[pi].includes(f)) fail("你的大樓那層沒有毒氣");
      t.ctrlDetox=f; t.roomUsed=true; // 結算時才生效，避免對手從毒層即時消失推測你在控制室
      log(G,"你在控制室解除自己大樓 "+fl(f)+" 的毒氣（結算時生效，本回合就不會在那層受毒）。",pi);
      return;
    }
    if(x.mode==="add"){
      if(f<0||f>8) fail("樓層不正確");
      if(G.poison[opp(pi)].includes(f)||t.poison===f) fail("那層已經（或即將）有毒氣");
      t.ctrlAdd=f; t.roomUsed=true;
      log(G,"你在控制室對 "+G.players[opp(pi)].name+" 大樓的 "+fl(f)+" 增加毒氣（結算時生效）。",pi);
      return;
    }
    fail("請選擇控制室功能");
  }
  if(R.type==="respec"){
    const v=[x.power,x.speed,x.carry].map(n=>Math.floor(Number(n)));
    const total=p.power+p.speed+p.carry;
    if(v.some(n=>!(n>=0))) fail("數值不正確");
    if(v[0]+v[1]+v[2]!==total) fail("總點數必須是 "+total);
    if(v[1]<1) fail("速度最低 1 點");
    if(!has(p,"dimpocket") && v[2]<p.inv.length) fail("負重不能低於目前道具數（"+p.inv.length+"）");
    [p.power,p.speed,p.carry]=v; t.roomUsed=true;
    log(G,"你在操作室重新分配：力量"+v[0]+"／速度"+v[1]+"／負重"+v[2]+"。",pi);
    return;
  }
  fail("這個房間沒有可以做的事");
}
function keepCards(G,pi,x){
  const p=G.players[pi], t=p.t, pd=t.pending;
  if(!pd) fail("沒有待處理的卡");
  const idx=[...new Set((x.idx||[]).map(n=>n|0))].filter(i=>i>=0&&i<pd.cards.length);
  // 垃圾場（同原版）：只有五件奇物限帶走 keep 件，垃圾與其他道具不受限
  if(idx.filter(i=>ITEMS[pd.cards[i]].sp).length>pd.keep) fail("奇物最多只能帶走 "+pd.keep+" 件");
  const kept=idx.map(i=>pd.cards[i]);
  // 次元口袋本身也在這批裡的話，拿到後負重就無上限
  const room=kept.includes("dimpocket")||has(p,"dimpocket")?Infinity:carryRoom(p);
  if(kept.length>room) fail("負重不足，最多再拿 "+room+" 張");
  const s=G.stock[pd.room];
  pd.cards.forEach((c,i)=>{ if(!idx.includes(i)) s[c]=(s[c]||0)+1; });
  kept.forEach(c=>{ p.inv.push(c); noteTook(p,pd.room,c); });
  // 翻出的張數少於可抽張數 → 房間已被翻光，剩下的就是沒拿的那些
  if(pd.cards.length<ROOMS[pd.room].draw) noteExact(G,p,pd.room,pd.cards.filter((c,i)=>!idx.includes(i)));
  log(G,"你在「"+ROOMS[pd.room].n+"」"+(kept.length?"拿到："+kept.map(c=>ITEMS[c].n).join("、"):"什麼都沒拿")+"。",pi);
  t.pending=null;
}

// ---------- 結算 ----------
// 防毒面具：毒氣傷害-2（最低0）
function poisonDmg(p,base){ return has(p,"gasmask")?Math.max(0,base-2):base; }
function fight(G,add){
  const [a,b]=G.players, ap=combatPower(a), bp=combatPower(b), ag=hasGun(a), bg=hasGun(b);
  let da=0, db=0;
  if(ag&&!bg) db=ap; else if(bg&&!ag) da=bp;
  else { if(ap>bp) db=ap-bp; else if(bp>ap) da=bp-ap; }
  a.hp-=da; b.hp-=db; reveal(G,a); reveal(G,b);
  add("⚔️ 兩人都在 "+fl(a.floor)+"，爆發戰鬥！"+a.name+" 武力"+ap+(ag?"🔫":"")+" vs "+b.name+" 武力"+bp+(bg?"🔫":"")+
    "："+(da||db?(da?a.name+" -"+da:"")+(da&&db?"、":"")+(db?b.name+" -"+db:""):"不分勝負"));
}
function deathCheck(G,add){
  G.players.forEach(p=>{
    if(!p.alive || p.hp>0) return;
    p.deathPower=combatPower(p); p.alive=false; p.hp=0; p.drain=0; p.deathRound=G.round;
    p.ghostSpeed=Math.max(1,moveSpeed(p));
    p.inv.forEach(it=>{ G.stock.morgue[it]=(G.stock.morgue[it]||0)+1; });
    p.inv=[]; p.floor=MORGUE_FLOOR; p.room=null; reveal(G,p);
    add("💀 "+p.name+" 死亡（死亡時武力 "+p.deathPower+"），遺物落入 B7 停屍間，化為暗影…");
  });
}
// 開局：兩人若選了同一個起始樓層，第1回合前先打一場
function openingEncounter(G){
  const P=G.players;
  if(P[0].floor!==P[1].floor){ startRound(G); return; }
  const add=(s,to)=>G.report.push({text:s,to});
  G.report=[];
  add("🚪 開局兩人都選在 "+fl(P[0].floor)+" 出發，一見面就打起來了！");
  fight(G,add); deathCheck(G,add);
  P.forEach(p=>add("❤️ "+p.name+"："+(p.alive?"HP "+p.hp:"暗影")));
  G.report.forEach(e=>log(G,e.text,e.to));
  G.phase="report"; P.forEach(p=>{ p.ready=false; });
}
function settle(G){
  const P=G.players, rep=G.report=[], r=G.round;
  const add=(s,to)=>rep.push({text:s,to});
  P.forEach(p=>add("你"+(p.alive?"":"（暗影）")+"停在 "+fl(p.floor)+(p.room?" "+ROOMS[p.room].n:""),p.id));
  const living=P.filter(p=>p.alive);
  // 1) 暗影：死亡的下一回合起，與活人同樓層 → 活人扣2血、暗影回2血，累積4血復活
  P.forEach(g=>{
    if(g.alive || g.deathRound>=r) return;
    const v=P[opp(g.id)];
    if(v.alive && v.floor===g.floor){
      v.hp-=2; g.drain+=2; reveal(G,v); reveal(G,g);
      add("👻 "+g.name+" 的暗影在 "+fl(g.floor)+" 與 "+v.name+" 相遇：吸取2血（"+v.name+" HP "+v.hp+"；暗影累積 "+g.drain+"/4）");
    }
  });
  // 2) 戰鬥：兩人都活著且同樓層
  if(living.length===2 && P[0].floor===P[1].floor) fight(G,add);
  // 3) 火箭筒
  P.forEach(p=>{
    const v=P[opp(p.id)];
    p.t.rockets.forEach(f=>{
      if(v.alive && v.floor===f){ v.hp-=4; reveal(G,v); add("🚀 "+p.name+" 的火箭筒命中 "+v.name+"（"+fl(f)+"）：-4（HP "+v.hp+"）"); }
      else add("🚀 "+p.name+" 的火箭筒轟炸 "+v.name+" 大樓 "+fl(f)+"，沒有命中。");
    });
  });
  // 4) 毒氣：先處理控制室解毒，再加入本回合新毒層，各自大樓各自計算
  P.forEach(p=>{
    const f=p.t.ctrlDetox, list=G.poison[p.id];
    if(f!==undefined && f!==null && list.includes(f)){ list.splice(list.indexOf(f),1); add("🧪 你在控制室解除了自己大樓 "+fl(f)+" 的毒氣",p.id); }
  });
  P.forEach(p=>{
    const target=G.poison[opp(p.id)], added=[];
    [p.t.poison,p.t.ctrlAdd].forEach(f=>{ if(f!==null && f>=0 && !target.includes(f)){ target.push(f); added.push(fl(f)); } });
    target.sort((x,y)=>x-y);
    if(added.length) add("☠️ "+p.name+" 讓 "+P[opp(p.id)].name+" 的大樓 "+added.join("、")+" 充滿毒氣");
  });
  const pd=POISON_DMG[r-1];
  living.forEach(p=>{
    if(!G.poison[p.id].includes(p.floor)) return;
    const mask=has(p,"gasmask"), dmg=poisonDmg(p,pd);
    if(dmg<=0){ add("😷 你在毒氣層 "+fl(p.floor)+"，防毒面具擋下了毒氣（-"+pd+" → 0）",p.id); return; }
    p.hp-=dmg;
    add("☠️ 你在毒氣層 "+fl(p.floor)+"：-"+dmg+(mask?"（防毒面具減免2）":"")+"（HP "+p.hp+"）",p.id);
    add("☠️ "+p.name+" 吸入毒氣：-"+dmg+"（HP "+p.hp+"）",opp(p.id));
  });
  // 5) 飢餓：第2回合起每回合支付1水1糧，每缺一項扣1血
  if(r>=2) living.forEach(p=>{
    if(p.t.canteen){ add("🍽️ 你在餐廳用餐，免付水糧",p.id); return; }
    let missing=0, paid=[];
    if(has(p,"water")&&has(p,"food")){ takeItem(p,"water"); takeItem(p,"food"); G.discard.push("water","food"); paid.push("水","糧"); }
    else if(has(p,"waterfood")){ takeItem(p,"waterfood"); G.discard.push("waterfood"); paid.push("生存補給"); }
    else {
      ["water","food"].forEach(k=>{ if(takeItem(p,k)){ G.discard.push(k); paid.push(ITEMS[k].n); } else missing++; });
    }
    if(missing){ p.hp-=missing; add("🍞 "+p.name+" 缺少水糧"+missing+"項：-"+missing+"（HP "+p.hp+"）"+(paid.length?"，已付："+paid.join("、"):"")); }
    else add("🍞 "+p.name+" 支付了 "+paid.join("、"));
  });
  // 6) 使用藥片／腎上腺素／酒（雙方各自決定）
  G.phase="items";
  living.forEach(p=>{ p.t.itemsDone=!(has(p,"pill")||has(p,"adrenaline")||has(p,"wine")); });
  if(P.every(p=>p.t.itemsDone)) finishSettle(G);
}
function useItems(G,pi,x){
  if(G.phase!=="items") fail("現在不是使用道具的時機");
  const p=G.players[pi], t=p.t;
  if(t.itemsDone) fail("你已經決定好了");
  const np=Math.max(0,x.pill|0), nw=Math.max(0,x.wine|0), ad=!!x.adrenaline;
  if(np>count(p,"pill")||nw>count(p,"wine")||(ad&&!has(p,"adrenaline"))) fail("道具數量不足");
  t.use={pill:np,wine:nw,adrenaline:ad}; t.itemsDone=true;
  if(G.players.every(q=>q.t.itemsDone)) finishSettle(G);
}
function finishSettle(G){
  const P=G.players, add=(s,to)=>G.report.push({text:s,to});
  P.forEach(p=>{
    const u=p.t.use; p.t.use=null;
    if(!u || !p.alive) return;
    for(let i=0;i<u.pill;i++){ takeItem(p,"pill"); G.discard.push("pill"); p.hp=Math.min(MAXHP,p.hp+2); add("💊 "+p.name+" 服用藥片：+2（HP "+p.hp+"）"); }
    for(let i=0;i<u.wine;i++){
      if(!takeItem(p,"wine")) break;
      G.discard.push("wine");
      const roll=1+Math.floor(G.rand()*6); let m;
      if(roll===1){ G.discard.push(...p.inv); p.inv=[]; m="丟棄所有道具！"; }
      else if(roll===2) m="無事發生";
      else if(roll===3){ p.power++; m="武力永久+1"; }
      else if(roll===4){ p.speed++; m="速度永久+1"; }
      else if(roll===5){ p.carry++; m="負重永久+1"; }
      else { p.hp=Math.min(MAXHP,p.hp+2); m="生命+2（HP "+p.hp+"）"; }
      add("🍷 "+p.name+" 喝酒擲出 "+roll+"："+m);
    }
    if(u.adrenaline && takeItem(p,"adrenaline")){
      G.discard.push("adrenaline");
      if(p.hp<1){ p.hp=1; add("💉 "+p.name+" 注射腎上腺素，撐住了最後一口氣（HP 1）"); }
      else add("💉 "+p.name+" 注射腎上腺素（本回合不會死亡）");
    }
  });
  deathCheck(G,add);
  // 暗影復活
  P.forEach(g=>{
    if(g.alive || g.drain<4) return;
    g.alive=true; g.hp=4; g.drain=0; g.deathPower=0; reveal(G,g);
    add("✨ "+g.name+" 的暗影吸滿4血，在 "+fl(g.floor)+" 復活！（HP 4）");
  });
  P.forEach(p=>add("❤️ "+p.name+"："+(p.alive?"HP "+p.hp:"暗影（累積 "+p.drain+"/4）")));
  G.report.forEach(e=>log(G,e.text,e.to));
  G.phase="report";
  P.forEach(p=>{ p.ready=false; });
}
function endGame(G){
  const P=G.players;
  P.forEach(p=>{
    if(p.alive){
      const g=count(p,"gold");
      if(g){ const before=p.hp; p.hp=Math.min(MAXHP,p.hp+g); log(G,"🪙 "+p.name+" 以 "+g+" 根金條換血："+before+" → "+p.hp); }
    }
  });
  const [a,b]=P, why=[];
  let w=-1;
  if(a.alive!==b.alive){ w=a.alive?0:1; why.push("只有 "+P[w].name+" 存活"); }
  else if(a.alive){
    if(a.hp!==b.hp){ w=a.hp>b.hp?0:1; why.push("血量 "+a.hp+" vs "+b.hp); }
    else {
      const ap=combatPower(a), bp=combatPower(b);
      why.push("血量相同（"+a.hp+"），比武力 "+ap+" vs "+bp);
      if(ap!==bp) w=ap>bp?0:1;
    }
  } else {
    why.push("兩人都死亡，比死亡時武力 "+a.deathPower+" vs "+b.deathPower);
    if(a.deathPower!==b.deathPower) w=a.deathPower>b.deathPower?0:1;
  }
  G.result={winner:w,why:why.join("；")};
  G.phase="end";
  log(G,"🏁 遊戲結束："+(w<0?"平手！":P[w].name+" 獲勝！")+"（"+G.result.why+"）");
}
// ===================== AI（只用公開資訊：對手上回合結算位置、血量、基礎素質、毒層、房間庫存）=====================
const AI_VAL={knifeX2:9,shotgun:9,pistol:8,waterfood:7,gasmask:7,dimpocket:6,pill:6,adrenaline:6,knife:5,rocket:8,rope:4,recycle:3,gold:3,wine:2,water:5,food:5,trash:-1};
const AI_NEED=["water","food","pill","adrenaline","pistol","shotgun","knifeX2","knife"];
function aiHungerLeft(G){ return Math.max(0,ROUNDS-Math.max(G.round,2)+1); }
function aiItemValue(G,p,it,extra){
  extra=extra||[];
  const c=k=>count(p,k)+extra.filter(x=>x===k).length;
  if(it==="water"||it==="food"){
    const have=c(it)+c("waterfood"), need=aiHungerLeft(G);
    return have>=need?0.3:(have===0?7.5:6-Math.min(3,have));
  }
  if(it==="waterfood") return c("water")+c("waterfood")>=aiHungerLeft(G)&&c("food")+c("waterfood")>=aiHungerLeft(G)?0.5:8;
  if(ITEMS[it].gun && (hasGun(p)||extra.some(x=>ITEMS[x].gun))) return ITEMS[it].w; // 第二把槍只剩武力加成
  if((it==="pill"||it==="adrenaline") && c(it)>=2) return 2;
  if((it==="gasmask"||it==="dimpocket"||it==="rope"||it==="recycle"||it==="rocket") && c(it)>=1) return 0;
  return AI_VAL[it];
}
function aiRoomValue(G,p,id){
  const R=ROOMS[id];
  if(R.draw){
    const s=stockGuess(G,p,id), deck=[];
    Object.keys(s).forEach(k=>{ for(let i=0;i<s[k];i++) deck.push(k); });
    if(!deck.length) return 0;
    const room=has(p,"dimpocket")?99:carryRoom(p);
    const vals=deck.map(k=>aiItemValue(G,p,k));
    if(room<=0){ // 背包滿：值不值得丟掉最差的道具來換
      const worst=Math.min(...p.inv.map(it=>aiItemValue(G,p,it)));
      return Math.max(0.2,(Math.max(...vals)-worst-1)*0.9);
    }
    const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    let n=Math.min(R.draw,R.keep||99,room,deck.length);
    const kinds=Object.keys(s).filter(k=>s[k]>0);
    if(kinds.length===1 && (kinds[0]==="water"||kinds[0]==="food")){
      const k=kinds[0]; n=Math.min(n,Math.max(0,aiHungerLeft(G)-count(p,k)-count(p,"waterfood")));
      return n*5*0.8;
    }
    if(id==="dump") return Math.max(...vals)>2?4:0.5; // 垃圾場可以只挑好的留
    return Math.max(0,avg)*n*(n>1?0.8:1);
  }
  switch(R.type){
    case "gene": return p.hp>=8&&G.round<=3?4:-5;
    case "canteen": { if(G.round<2) return 0.3; const miss=(count(p,"water")+count(p,"waterfood")?0:1)+(count(p,"food")+count(p,"waterfood")?0:1); return miss?2.5*miss:0.5; }
    case "control": return G.poison[p.id].length?3:2;
  }
  return 0;
}
// 猜對手這回合會在哪：以上回合結算位置為中心，可移動範圍內，偏向有資源的樓層
function aiOppFloorWeights(G,pi){
  const o=G.players[opp(pi)], known=G.reveal[o.id]!==null, base=known?G.reveal[o.id]:2, age=known?Math.max(1,G.round-G.revealRound[o.id]):1;
  const sp=(o.alive?o.speed+1:o.ghostSpeed)*age, w=[];
  for(let f=0;f<9;f++){
    const d=Math.abs(f-base);
    let x=d>sp?0.05:1/(1+d);
    if(o.alive && G.poison[o.id].includes(f)) x*=0.25;
    if(o.alive && [1,2,4,6].includes(f)) x*=1.3;
    w.push(x);
  }
  const sum=w.reduce((a,b)=>a+b,0); return w.map(x=>x/sum);
}
function aiPickWeighted(G,list){ // list: [[value,weight]]
  const tot=list.reduce((a,[,w])=>a+Math.max(0,w),0); let r=G.rand()*tot;
  for(const [v,w] of list){ r-=Math.max(0,w); if(r<=0) return v; }
  return list.length?list[list.length-1][0]:null;
}
function aiPoisonPick(G,pi){
  const o=G.players[opp(pi)];
  const cand=[...Array(9).keys()].filter(f=>!G.poison[o.id].includes(f));
  if(!cand.length) return -1;
  if(!o.alive) return cand[Math.floor(G.rand()*cand.length)];
  const w=aiOppFloorWeights(G,pi);
  return aiPickWeighted(G,cand.map(f=>[f,w[f]*w[f]]));
}
function aiPlan(G,pi){
  const p=G.players[pi], o=G.players[opp(pi)], t=p.t, steps=t.steps;
  const ow=aiOppFloorWeights(G,pi), myP=combatPower(p), oP=o.power+(G.round>1?2:0)+(G.round>3?2:0);
  const opts=[];
  const floorScore=f=>{
    let s=0;
    const pdmg=poisonDmg(p,POISON_DMG[G.round-1]);
    if(G.poison[pi].includes(f) && pdmg>0) s-=3*pdmg+2;
    if(f===G.reveal[pi] && G.revealRound[pi]===G.round-1) s-=0.75*pdmg; // 對手可能往我上回合的位置放毒
    if(o.alive){
      const edge=hasGun(p)?myP:(myP-oP);
      s+=ow[f]*(edge>0?Math.min(edge,6):edge*1.5)*(p.hp<=4?2:1);
    } else s-=ow[f]*8;
    return s;
  };
  // 這回合走不到的好房間（例如缺糧時的 B5 糧倉）：往那邊靠近也有分
  const goals=Object.keys(ROOMS).filter(id=>!ROOMS[id].needTP && Math.abs(ROOMS[id].f-p.floor)>steps)
    .map(id=>({f:ROOMS[id].f,v:aiRoomValue(G,p,id)})).filter(g=>g.v>=5);
  const travel=f=>goals.reduce((s,g)=>s+g.v*0.12*(Math.abs(p.floor-g.f)-Math.abs(f-g.f)),0);
  for(let f=0;f<9;f++){
    if(Math.abs(f-p.floor)>steps) continue;
    if(t.mustMove && f===t.startFloor) continue;
    const fs=floorScore(f)+travel(f);
    opts.push({floor:f,room:null,score:fs});
    Object.keys(ROOMS).forEach(id=>{ const R=ROOMS[id]; if(R.f!==f||R.needTP) return; opts.push({floor:f,room:id,score:fs+aiRoomValue(G,p,id)}); });
  }
  if(p.tpLeft>0 && Math.abs(p.floor-TELEPORT_FLOOR)+2<=steps && !(t.mustMove && t.startFloor===WAREHOUSE_FLOOR))
    opts.push({floor:WAREHOUSE_FLOOR,room:"warehouse",tp:true,score:floorScore(WAREHOUSE_FLOOR)+aiRoomValue(G,p,"warehouse")*1.2});
  opts.forEach(o=>{ o.score+=G.rand()*1.2; });
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
function aiKeep(G,pi){
  const p=G.players[pi], pd=p.t.pending, A=(a,x)=>{ try{ apply(G,pi,a,x); return true; }catch(e){ return false; } };
  const order=pd.cards.map((c,i)=>i).sort((a,b)=>aiItemValue(G,p,pd.cards[b])-aiItemValue(G,p,pd.cards[a]));
  const pick=[], taken=[];
  for(const i of order){
    const c=pd.cards[i];
    if(ITEMS[c].sp && taken.filter(x=>ITEMS[x].sp).length>=pd.keep) continue;
    if(aiItemValue(G,p,c,taken)<=0.3) continue;
    const pocket=has(p,"dimpocket")||taken.includes("dimpocket")||c==="dimpocket";
    if(!pocket && p.inv.length+pick.length>=p.carry){
      // 背包滿：丟掉最不值錢的道具換更好的
      let wi=-1, wv=Infinity;
      p.inv.forEach((it,j)=>{ const v=aiItemValue(G,p,it); if(v<wv){ wv=v; wi=j; } });
      if(wi<0 || aiItemValue(G,p,c,taken)<=wv+1) continue;
      A("drop",{idx:wi});
    }
    pick.push(i); taken.push(c);
  }
  if(!A("keep",{idx:pick})) A("keep",{idx:[]});
}
// 每次呼叫只做該階段需要的事；回傳 true 代表狀態有變
function aiStep(G,pi){
  const p=G.players[pi], o=G.players[opp(pi)], t=p.t, A=(a,x)=>{ try{ apply(G,pi,a,x); return true; }catch(e){ return false; } };
  if(G.phase==="setup"){
    if(p.ready) return false;
    const pre=[[4,3,3],[3,3,4],[4,2,4],[3,4,3],[5,2,3]][Math.floor(G.rand()*5)];
    return A("setup",{power:pre[0],speed:Math.max(1,pre[1]),carry:pre[2]-(pre[1]<1?1:0),floor:START_FLOORS[Math.floor(G.rand()*3)]});
  }
  if(G.phase==="report"){ return p.ready?false:A("ready"); }
  if(G.phase==="items"){
    if(t.itemsDone) return false;
    const last=G.round>=ROUNDS, np=count(p,"pill");
    let pill=last?np:(p.hp<=6?Math.min(np,Math.ceil((MAXHP-p.hp)/2)):0);
    if(p.hp<=0) pill=Math.max(pill,Math.min(np,Math.ceil((1-p.hp)/2)));
    const after=p.hp+pill*2;
    const adrenaline=after<=0 && has(p,"adrenaline");
    const wine=(G.round<=4 && p.inv.length<=3 && after>0)?count(p,"wine"):0;
    return A("useItems",{pill,wine,adrenaline});
  }
  if(G.phase!=="action" || t.ended) return false;
  if(t.poison===null && !A("poison",{floor:aiPoisonPick(G,pi)})) A("poison",{floor:-1});
  if(!p.alive){
    // 暗影：追向對手上回合的位置吸血
    let target=o.alive&&G.reveal[o.id]!==null?G.reveal[o.id]:p.floor;
    if(target===t.startFloor) target=t.startFloor>0?t.startFloor-1:1;
    while(t.steps>0 && p.floor!==target) A("move",{dir:target<p.floor?-1:1});
    A("endTurn"); return true;
  }
  if(has(p,"rocket") && o.alive){
    const w=aiOppFloorWeights(G,pi), f=w.indexOf(Math.max(...w));
    A("rocket",{floor:f});
  }
  if(has(p,"recycle") && G.discard.length && carryRoom(p)>0) A("recycle");
  const plan=aiPlan(G,pi);
  if(plan.tp){ while(p.floor!==TELEPORT_FLOOR && t.steps>0) A("move",{dir:TELEPORT_FLOOR<p.floor?-1:1}); A("teleport",{floor:WAREHOUSE_FLOOR}); }
  else while(p.floor!==plan.floor && t.steps>0) A("move",{dir:plan.floor<p.floor?-1:1});
  A("enter",{room:plan.room&&ROOMS[plan.room].f===p.floor?plan.room:null});
  if(p.room){
    const R=ROOMS[p.room];
    if(R.draw){ if(A("room",{}) && t.pending) aiKeep(G,pi); }
    else if(R.type==="control"){
      const mine=G.poison[pi].slice().sort((a,b)=>[1,6,4,2].indexOf(b)-[1,6,4,2].indexOf(a));
      if(mine.length) A("room",{mode:"detox",floor:mine[0]});
      else { const w=aiOppFloorWeights(G,pi); const c=[...Array(9).keys()].filter(f=>!G.poison[opp(pi)].includes(f)&&f!==t.poison).sort((a,b)=>w[b]-w[a]); if(c.length) A("room",{mode:"add",floor:c[0]}); }
    }
    else if(R.type==="gene"||R.type==="canteen") A("room",{});
    if(R.draw && !R.noGold && has(p,"gold") && G.round<ROUNDS && aiRoomValue(G,p,p.room)>=4) A("gold",{});
  }
  A("endTurn");
  return true;
}
if(typeof module!=="undefined") module.exports={apply,newGame,startRound,aiStep,ROOMS,ITEMS,FLOORS,combatPower,carryRoom};
</script>

<!-- ===================== NETWORK + UI ===================== -->
<script>
const PEER_PREFIX="jbts2p-v1-";
let NET=null;          // {send(obj)}
let ME=0;              // 0=房主, 1=加入者
let G=null;            // 房主：權威狀態；加入者：收到的狀態副本
let UI={};             // 純畫面暫存（抽卡勾選、配點草稿等）
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg){
  const d=document.createElement("div"); d.className="toast"; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(),2600);
}
function netStatus(s){ $("#netStat").textContent=s; }

// ---------- 連線 ----------
function randCode(){ const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<5;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function makeTransport(kind,code,role,onData,onOpen,onClose){
  if(kind==="local"){
    // 同一台電腦兩個分頁測試用
    const ch=new BroadcastChannel(PEER_PREFIX+code);
    const me=role;
    ch.onmessage=e=>{ if(e.data.from!==me) onData(e.data.m); };
    const t={send:m=>ch.postMessage({from:me,m}),close:()=>ch.close()};
    setTimeout(onOpen,50);
    return t;
  }
  if(typeof Peer==="undefined"){ toast("無法載入 PeerJS（需要網路）"); return null; }
  let conn=null;
  const t={send:m=>{ if(conn&&conn.open) conn.send(m); },close:()=>{ try{peer.destroy();}catch(e){} }};
  const wire=c=>{
    conn=c;
    c.on("open",onOpen);
    c.on("data",onData);
    c.on("close",onClose);
    c.on("error",e=>toast("連線錯誤："+e));
  };
  const peer=role==="host"?new Peer(PEER_PREFIX+code):new Peer();
  peer.on("error",e=>{
    if(e.type==="unavailable-id"){ toast("房間碼衝突，請重新建立"); }
    else if(e.type==="peer-unavailable"){ toast("找不到這個房間碼"); }
    else toast("連線錯誤："+e.type);
    netStatus("連線失敗");
  });
  peer.on("disconnected",()=>{ try{peer.reconnect();}catch(e){} });
  if(role==="host"){
    peer.on("open",()=>netStatus("房間已建立，等待對手加入…"));
    peer.on("connection",c=>{ if(conn&&conn.open){ c.close(); return; } wire(c); });
  } else {
    peer.on("open",()=>{ netStatus("連線中…"); wire(peer.connect(PEER_PREFIX+code,{reliable:true,serialization:"json"})); });
  }
  return t;
}
function hostGame(kind,name){
  const code=randCode(); ME=0;
  UI.code=code; UI.myName=name; UI.waiting=true; render();
  NET=makeTransport(kind,code,"host",msg=>{
    if(msg.t==="hello"){
      if(!G) G=newGame([name,msg.name||"玩家2"]);
      netStatus("已連線（房主）"); UI.waiting=false; broadcast(); return;
    }
    if(msg.t==="act") doAct(1,msg.a,msg.x);
  },()=>{},()=>{ netStatus("對手已斷線"); toast("對手已斷線"); });
}
function joinGame(kind,code,name){
  ME=1; UI.myName=name; UI.joining=true; render();
  NET=makeTransport(kind,code.trim().toUpperCase(),"guest",msg=>{
    if(msg.t==="state"){ G=msg.s; UI.joining=false; netStatus("已連線"); render(); }
    if(msg.t==="err") toast(msg.e);
  },()=>{ NET.send({t:"hello",name}); },()=>{ netStatus("房主已斷線"); toast("房主已斷線"); });
}
// 單人對戰 AI：AI 當玩家2，在本機用同一套引擎行動
function startAI(name){
  ME=0; UI.ai=true; NET={send(){}};
  G=newGame([name,"AI"]); G.opts.dice=true; netStatus("對戰 AI");
  broadcast();
}
function scheduleAI(){
  clearTimeout(UI.aiTimer);
  if(!UI.ai || !G) return;
  if(G.phase==="action" && waitingFirst(G,1)) return; // AI 後手：等玩家結束回合
  const delay=G.phase==="action"?1200:G.phase==="items"?700:G.phase==="setup"?400:300;
  UI.aiTimer=setTimeout(()=>{ G.rand=Math.random; if(aiStep(G,1)) broadcast(); },delay);
}
function broadcast(){
  if(!G) return;
  const s=JSON.parse(JSON.stringify(G,(k,v)=>k==="rand"?undefined:v));
  NET&&NET.send({t:"state",s});
  render();
  scheduleAI();
}
function doAct(pi,a,x){
  try{ apply(G,pi,a,x); }
  catch(e){ if(pi===ME) toast(e.message); else NET.send({t:"err",e:e.message}); return; }
  G.rand=Math.random;
  broadcast();
}
function act(a,x){
  if(ME===0) doAct(0,a,x);
  else NET.send({t:"act",a,x});
}

// ---------- 畫面 ----------
function render(){
  const app=$("#app");
  if(!G){ app.innerHTML=lobbyHTML(); bindLobby(); $("#modalRoot").innerHTML=""; return; }
  if(G.phase==="setup"){ app.innerHTML=setupHTML(); bindSetup(); $("#modalRoot").innerHTML=""; return; }
  app.innerHTML=gameHTML();
  bindGame();
  renderModal();
  const lg=$("#log"); if(lg) lg.scrollTop=lg.scrollHeight;
}
function lobbyHTML(){
  if(UI.waiting) return `<div class="lobby"><div class="panel">
    <h3>等待對手加入</h3><div class="muted">把房間碼告訴對手：</div>
    <div class="code">${UI.code}</div>
    <div class="muted" style="font-size:13px">對手開啟同一個檔案 → 輸入名字 → 「加入房間」並填入這組碼。</div></div></div>`;
  if(UI.joining) return `<div class="lobby"><div class="panel"><h3>連線中…</h3></div></div>`;
  return `<div class="lobby">
    <div class="panel">
      <label>你的名字 <input id="nm" maxlength="12" value="${esc(UI.myName||"")}" placeholder="玩家"></label>
      <label>連線方式 <select id="kind">
        <option value="peer">網路連線（房間碼，兩台電腦都要能上網）</option>
        <option value="local">同電腦兩個分頁（測試用）</option></select></label>
    </div>
    <div class="panel"><h3>單人對戰 AI</h3><div class="muted" style="font-size:13px">不用連線，直接和電腦對打。</div><button class="btn" id="aiGame">開始對戰 AI</button></div>
    <div class="panel"><h3>建立房間</h3><button class="btn" id="host">建立房間</button></div>
    <div class="panel"><h3>加入房間</h3>
      <div class="row"><input id="code" maxlength="5" placeholder="房間碼" style="text-transform:uppercase;width:140px">
      <button class="btn" id="join">加入</button></div></div>
    <div class="panel rules">${rulesHTML()}</div>
  </div>`;
}
function rulesHTML(){
  return `<h3>規則摘要</h3>
  <div>・開局把 <b>10 點</b> 分給 力量／速度／負重；HP 10。兩人各在自己的大樓（2F～B7），各自秘密選 <b>1F／B1／B2</b> 出發，選到同一層開局就先打一場。房間物資兩棟<b>共用庫存</b>，剩多少<b>看不到</b>，要搜了才知道。</div>
  <div>・速度最低 1 點。對戰 AI 時每回合<b>擲骰比大小</b>，大的先行動（同點重擲），後手要等先手結束回合才能使用房間。<br>・每回合：先<b>投毒</b>（選對方大樓一層）→ 用速度步數上下移動（<b>不能停在出發的樓層</b>）→ 停在一個房間使用功能 → 結束回合。</div>
  <div>・對手位置是隱藏的，只有<b>戰鬥</b>、暗影吸血、被火箭筒命中或死亡時才會知道對方在哪一層。</div>
  <div>・結算順序：<b>暗影</b>（死者與活人同樓層：活人-2、暗影+2，累積4復活）→ <b>戰鬥</b>（同樓層比武力，差值為傷害；持槍者無視對方武力直接造成全部武力傷害）→ 火箭筒 → <b>毒氣</b>（各自大樓，傷害 1/2/2/3/3/4）→ <b>飢餓</b>（第2回合起付1水1糧，每缺一項-1）→ 使用藥片／腎上腺素／酒 → 死亡判定。</div>
  <div>・共 <b>6 回合</b>，比最後血量（金條每根+1血，上限10），同血比武力；兩人都死比死亡時武力。</div>`;
}
function bindLobby(){
  if(!$("#host")) return; // 等待中／連線中畫面沒有按鈕
  const nm=()=>($("#nm").value.trim()||"玩家");
  $("#host").onclick=()=>hostGame($("#kind").value,nm());
  $("#aiGame").onclick=()=>startAI(nm());
  $("#join").onclick=()=>{ const c=$("#code").value.trim(); if(!c){ toast("請輸入房間碼"); return; } joinGame($("#kind").value,c,nm()); };
}
function setupHTML(){
  const me=G.players[ME], op=G.players[1-ME];
  if(me.ready) return `<div class="lobby"><div class="panel"><h3>已完成配點</h3><div class="muted">等待 ${esc(op.name)} 配點…</div></div></div>`;
  UI.alloc=UI.alloc||{power:4,speed:3,carry:3,floor:1};
  const A=UI.alloc, left=10-A.power-A.speed-A.carry;
  const row=(k,lbl,desc)=>`<div class="statrow"><b>${lbl}</b><button class="btn small ghost" data-d="-1" data-k="${k}">−</button>
    <span class="v">${A[k]}</span><button class="btn small ghost" data-d="1" data-k="${k}">＋</button><span class="muted" style="font-size:12px">${desc}</span></div>`;
  return `<div class="lobby"><div class="panel">
    <h3>${esc(me.name)} 的素質分配</h3>
    <div class="muted">對手：${esc(op.name)}　剩餘點數：<b style="color:var(--gold)">${left}</b></div>
    ${row("power","力量","戰鬥武力")}${row("speed","速度","每回合可移動樓層數（最低1）")}${row("carry","負重","可攜帶道具數")}
    <div style="margin:8px 0 4px"><b>起始樓層</b> <span class="muted" style="font-size:12px">（對手看不到；兩人選同一層會在開局直接打一場）</span></div>
    <div class="row" style="margin-bottom:10px">${START_FLOORS.map(f=>`<button class="btn small ${A.floor===f?"":"ghost"}" data-sf="${f}">${fl(f)}</button>`).join("")}</div>
    <button class="btn" id="setOk" ${left!==0?"disabled":""}>確認</button></div>
    <div class="panel rules">${rulesHTML()}</div></div>`;
}
function bindSetup(){
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    const A=UI.alloc, k=b.dataset.k, d=+b.dataset.d, left=10-A.power-A.speed-A.carry;
    if(d>0&&left<=0) return; if(d<0&&A[k]<=(k==="speed"?1:0)) return;
    A[k]+=d; render();
  });
  document.querySelectorAll("[data-sf]").forEach(b=>b.onclick=()=>{ UI.alloc.floor=+b.dataset.sf; render(); });
  const ok=$("#setOk"); if(ok) ok.onclick=()=>act("setup",UI.alloc);
}

function itemCard(it,i,removable){
  const I=ITEMS[it];
  return `<span class="card ${I.w?"weapon":""} ${I.sp?"special":""} t-${tierOf(it)} i-${it}" title="${esc(I.d||"")}"><span class="ci">${itemIconHTML(it)}</span>${I.n}${removable?`<span class="x" data-drop="${i}" title="丟棄">✕</span>`:""}</span>`;
}
function pCard(p,cls,full){
  const hpPct=Math.max(0,p.hp)/MAXHP*100;
  return `<div class="pcard ${cls}"><div class="row"><span class="nm">${esc(p.name)}</span>
    ${p.alive?`<span>HP <b>${p.hp}</b>/10</span>`:`<span class="muted">👻 暗影（${p.drain}/4）</span>`}</div>
    <div class="hpbar"><i style="width:${hpPct}%;${p.hp<=3?"background:var(--bad)":""}"></i></div>
    <div class="stats">力量 <b>${p.power}</b>　速度 <b>${p.speed}</b>${full&&has(p,"rope")?"(+2)":""}　負重 <b>${full&&has(p,"dimpocket")?"∞":p.carry}</b>${full?`　武力 <b>${combatPower(p)}</b>${hasGun(p)?" 🔫":""}`:""}</div></div>`;
}
const PHASE_NAME={action:"行動階段",items:"結算：使用道具",report:"結算報告",end:"遊戲結束"};
function gameHTML(){
  const me=G.players[ME], op=G.players[1-ME];
  return `<div class="topbar">${pCard(me,"me",true)}
    <div class="roundbox"><div class="rn">${G.round?`第 ${G.round} / 6 回合`:"開局"}</div><div class="ph">${PHASE_NAME[G.phase]||""}</div>
      <div class="ph">本回合毒氣 -${POISON_DMG[G.round-1]||"-"}</div></div>${pCard(G.phase==="action"&&op.pub?Object.assign({},op,op.pub):op,"opp")}</div>
  <div class="main">
    ${buildingHTML(ME)}
    ${buildingHTML(1-ME)}
    <div class="side">${actionHTML()}
      <div class="panel"><h3>背包 <span class="muted" style="font-size:12px">${me.inv.length}/${has(me,"dimpocket")?"∞":me.carry}</span></h3>
        <div class="inv">${me.inv.length?me.inv.map((it,i)=>itemCard(it,i,G.phase==="action"&&!me.t.ended)).join(""):'<span class="muted">空</span>'}</div>
        ${itemButtonsHTML()}</div>
      <div class="panel"><h3>紀錄</h3><div class="log" id="log">${G.log.filter(l=>l.to===undefined||l.to===ME).slice(-120).map(l=>
        `<div class="${l.to!==undefined?"pv":""} ${/^── /.test(l.text)?"rd":""}">${esc(l.text)}</div>`).join("")}</div></div>
    </div>
  </div>`;
}
function buildingHTML(pi){
  const mine=pi===ME, p=G.players[pi], poisoned=G.poison[pi];
  // 自己大樓：即時位置；對方大樓：只顯示上回合結算時的位置（行動中隱藏）
  const showFloor=mine?p.floor:G.reveal[pi];
  const fresh=!mine && G.revealRound[pi]===G.round && G.phase!=="action";
  const t=G.players[ME].t;
  const pendingPoison=!mine && G.phase==="action" ? [t.poison,t.ctrlAdd].filter(f=>f!==null&&f>=0) : [];
  const rows=FLOORS.map((name,f)=>{
    const rooms=Object.entries(ROOMS).filter(([,R])=>R.f===f).map(([id,R])=>{
      let cls="room";
      if(mine){
        const me=G.players[ME];
        if(me.room===id) cls+=" in";
        else if(G.phase==="action" && me.alive && !t.ended && !t.committed && t.poison!==null && me.floor===f && (!R.needTP||t.wh) && !(t.mustMove&&f===t.startFloor)) cls+=" click";
        if(R.needTP && !(me.floor===f && t.wh)) cls+=" locked";
      }
      const left=null; // 庫存未知，不顯示數量
      return `<span class="${cls}" data-room="${mine?id:""}" title="${esc(R.d)}">${R.n}${left!==null?` <span class="muted">${left}</span>`:""}</span>`;
    }).join("");
    const isP=poisoned.includes(f);
    let tok="";
    if(showFloor===f) tok=`<span class="tok ${p.alive?(mine?"me":"opp"):"ghost"}" title="${mine?"":"最後一次看到對手的位置（第"+G.revealRound[pi]+"回合）"}">${p.alive?(mine?"你":esc(p.name)):"👻"}${!mine&&!fresh?"?":""}</span>`;
    return `<div class="floor ${isP?"poison":""} ${showFloor===f?"here":""} ${pendingPoison.includes(f)?"target":""}">
      <span class="fl">${name}</span><div class="rooms">${rooms}${isP?'<span class="skull">☠毒</span>':""}${tok}</div></div>`;
  }).join("");
  return `<div class="panel bld ${mine?"me":"opp"}"><h3>${mine?"你的大樓":esc(p.name)+" 的大樓"}
    <span class="tag">${mine?"紫色＝毒氣層":"標記＝最後一次看到對手的位置（戰鬥等才會更新）；虛線＝你本回合要放毒的樓層"}</span></h3>${rows}</div>`;
}
function actionHTML(){
  const me=G.players[ME], t=me.t, op=G.players[1-ME];
  if(G.phase==="end"){
    const R=G.result, w=R.winner;
    return `<div class="panel"><h3>${w<0?"平手！":(w===ME?"🏆 你贏了！":"你輸了…")}</h3>
      <div class="muted">${esc(R.why)}</div><br>
      <button class="btn" id="rematch">再來一局</button></div>`;
  }
  if(G.phase==="report"||G.phase==="items")
    return `<div class="panel"><h3>結算中</h3><div class="muted">${G.phase==="items"?(t.itemsDone?"等待 "+esc(op.name)+" 決定是否使用道具…":"請決定是否使用道具"):(me.ready?"等待 "+esc(op.name)+"…":"查看結算報告")}</div></div>`;
  const DICE="⚀⚁⚂⚃⚄⚅";
  const diceNote=G.dice?`<div class="notice" style="margin-bottom:8px">🎲 ${G.dice.map(([a,b])=>`${ME===0?"你":esc(G.players[0].name)} ${DICE[a-1]}${a} vs ${ME===1?"你":esc(G.players[1].name)} ${DICE[b-1]}${b}`).join("（同點重擲）→ ")}<br><b>${G.first===ME?"你先行動":esc(op.name)+" 先行動"}</b>${waitingFirst(G,ME)?"：等它結束回合後你才能搜索房間（投毒、移動可以先做）":""}</div>`:"";
  if(t.ended) return `<div class="panel">${diceNote}<h3>已結束回合</h3><div class="muted">等待 ${esc(op.name)} 行動…</div></div>`;
  let h=`<div class="panel">${diceNote}<h3>${me.alive?"行動":"暗影行動"}</h3>`;
  if(t.poison===null){
    const opts=FLOORS.map((n,f)=>G.poison[1-ME].includes(f)?"":`<button class="btn small ghost" data-poison="${f}">${n}</button>`).join("");
    return h+`<div class="notice">第1步：選擇 ${esc(op.name)} 大樓要放毒的樓層（結算時生效）</div>
      <div class="row" style="margin-top:8px">${opts}<button class="btn small ghost" data-poison="-1">不投毒</button></div></div>`;
  }
  h+=`<div class="steps">剩餘步數 <b>${t.steps}</b>　${me.alive?`傳送剩 ${me.tpLeft} 次`:"暗影只能移動，不能進房間"}</div>`;
  if(t.mustMove && me.floor===t.startFloor && !t.committed) h+=`<div class="notice" style="margin-top:6px">每回合不能停留在出發的樓層（${fl(t.startFloor)}），請先移動。</div>`;
  if(!t.committed){
    h+=`<div class="row" style="margin:8px 0"><button class="btn small" data-move="-1" ${t.steps<1||me.floor===0?"disabled":""}>▲ 上樓</button>
      <button class="btn small" data-move="1" ${t.steps<1||me.floor===8?"disabled":""}>▼ 下樓</button>
      ${me.alive&&me.floor===TELEPORT_FLOOR?`<button class="btn small" id="tp" ${t.steps<2||me.tpLeft<1?"disabled":""}>🌀 傳送（2步）</button>`:""}</div>`;
    if(me.alive) h+=`<div class="muted" style="font-size:13px">移動完後，點你所在樓層的房間進入（每回合一間）。</div>
      <div class="row" style="margin-top:8px"><button class="btn small ghost" id="stay" ${t.mustMove&&me.floor===t.startFloor?"disabled":""}>不進房間</button></div>`;
  } else if(me.room){
    const R=ROOMS[me.room];
    h+=`<div class="notice" style="margin:8px 0">你在 <b>${fl(me.floor)} ${R.n}</b>：${esc(R.d)}</div>`;
    if(!t.roomUsed && R.type!=="teleport"){
      const wt=waitingFirst(G,ME), dis=wt?"disabled":"";
      if(R.type==="control") h+=`<button class="btn small" id="ctrl" ${dis}>${wt?"等對手先行動…":"使用控制室"}</button>`;
      else if(R.type==="respec") h+=`<button class="btn small" id="respec" ${dis}>${wt?"等對手先行動…":"重新分配素質"}</button>`;
      else if(R.type==="gene") h+=`<button class="btn small" id="roomGo" ${dis}>${wt?"等對手先行動…":"使用基因庫（-2血）"}</button>`;
      else h+=`<button class="btn small" id="roomGo" ${waitingFirst(G,ME)?"disabled":""}>${waitingFirst(G,ME)?"等對手先行動…":R.draw?"搜索房間":"使用"}</button>`;
    }
    if(R.draw && !R.noGold && has(me,"gold") && !t.goldUsed && !t.pending){
      h+=`<div class="row" style="margin-top:8px"><button class="btn small ghost" id="goldDraw">🪙 用1根金條多抽1張（隨機）</button></div>`;
    }
  } else h+=`<div class="muted" style="margin:8px 0">停留在 ${fl(me.floor)}，沒有進房間。</div>`;
  h+=`<div style="margin-top:10px"><button class="btn" id="endTurn">結束回合</button></div></div>`;
  return h;
}
function itemButtonsHTML(){
  const me=G.players[ME], t=me.t;
  if(G.phase!=="action"||t.ended||!me.alive||t.poison===null) return "";
  let b="";
  if(has(me,"rocket")) b+=`<button class="btn small ghost" id="rocket" ${t.rockets.length?"disabled":""}>🚀 ${t.rockets.length?"本回合已發射（"+fl(t.rockets[0])+"）":"發射火箭筒"}</button>`;
  if(has(me,"recycle")) b+=`<button class="btn small ghost" id="recycle" ${t.recycled||!G.discard.length?"disabled":""}>♻️ 回收（棄牌堆 ${G.discard.length}）</button>`;
  return b?`<div class="row" style="margin-top:8px">${b}</div>`:"";
}
function bindGame(){
  document.querySelectorAll("[data-poison]").forEach(b=>b.onclick=()=>act("poison",{floor:+b.dataset.poison}));
  document.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>act("move",{dir:+b.dataset.move}));
  document.querySelectorAll(".room.click").forEach(b=>b.onclick=()=>act("enter",{room:b.dataset.room}));

  document.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{
    const it=G.players[ME].inv[+b.dataset.drop];
    confirmModal("確定丟掉 "+ITEMS[it].n+"？",()=>act("drop",{idx:+b.dataset.drop}));
  });
  const on=(id,fn)=>{ const e=$("#"+id); if(e) e.onclick=fn; };
  on("stay",()=>act("enter",{room:null}));
  on("goldDraw",()=>act("gold",{}));
  on("roomGo",()=>act("room",{}));
  on("endTurn",()=>{
    const me=G.players[ME];
    if(me.t.mustMove && me.floor===me.t.startFloor){ toast("每回合不能停留在出發的樓層，請先移動"); return; }
    if(me.alive && !me.t.committed) confirmModal("你還沒進房間，確定直接結束回合？",()=>act("endTurn"));
    else act("endTurn");
  });
  on("tp",()=>{ UI.modal="tp"; renderModal(); });
  on("ctrl",()=>{ UI.modal="ctrl"; renderModal(); });
  on("respec",()=>{ const me=G.players[ME]; UI.re={power:me.power,speed:me.speed,carry:me.carry}; UI.modal="respec"; renderModal(); });
  on("rocket",()=>{ UI.modal="rocket"; renderModal(); });
  on("recycle",()=>act("recycle"));
  on("rematch",()=>act("rematch"));
}

let __icN=0;
const itemIconHTML=it=>{
  if(!ITEM_SVG[it]) return ITEMS[it].ic;
  const id="ig"+(++__icN);
  return `<svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb,currentColor 45%,#fff)"/><stop offset=".55" style="stop-color:currentColor"/><stop offset="1" style="stop-color:color-mix(in srgb,currentColor 55%,#000)"/></linearGradient></defs><path fill="url(#${id})" stroke="rgba(0,0,0,.45)" stroke-width="10" paint-order="stroke" d="${ITEM_SVG[it]}"/></svg>`;
};
// ---------- 音效（Web Audio 即時合成，移植自原版：翻牌＝腳步聲、稀有＝叮）----------
const SFX=(()=>{
  let ctx=null, master=null, noiseBuf=null, muted=false;
  try{ muted=localStorage.getItem("sfxMuted")==="1"; }catch(e){}
  const J=(x,p)=>x*(1+(Math.random()*2-1)*p);
  function ensure(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=0.85;
      const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=8;
      master.connect(comp); comp.connect(ctx.destination);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  function env(g,t0,peak,atk,dur){ g.setValueAtTime(0.0001,t0); g.linearRampToValueAtTime(Math.max(0.0002,peak),t0+atk); g.exponentialRampToValueAtTime(0.0001,t0+dur); }
  function osc(o){ try{
    const t0=ctx.currentTime+(o.delay||0), g=ctx.createGain(), n=ctx.createOscillator();
    n.type=o.type||"sine"; n.frequency.setValueAtTime(o.f0,t0); if(o.f1) n.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),t0+o.dur);
    n.connect(g); g.connect(master); env(g.gain,t0,o.peak,o.atk||0.006,o.dur); n.start(t0); n.stop(t0+o.dur+0.03);
  }catch(e){} }
  function noise(o){ try{
    const t0=ctx.currentTime+(o.delay||0), g=ctx.createGain(), s=ctx.createBufferSource(), f=ctx.createBiquadFilter();
    s.buffer=noiseBuf; f.type=o.ftype||"lowpass"; f.frequency.setValueAtTime(o.f0,t0); if(o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(40,o.f1),t0+o.dur);
    s.connect(f); f.connect(g); g.connect(master); env(g.gain,t0,o.peak,0.003,o.dur); s.start(t0,Math.random()*0.5); s.stop(t0+o.dur+0.03);
  }catch(e){} }
  const ok=()=>!muted && !!ensure();
  return {
    isMuted:()=>muted,
    setMuted(v){ muted=v; try{ localStorage.setItem("sfxMuted",v?"1":"0"); }catch(e){} },
    move(){ if(!ok()) return; const p=J(1,0.08), v=J(1,0.15);
      [0,0.09].forEach((d,i)=>{ const q=p*(i?0.93:1);
        osc({f0:170*q,f1:70,dur:0.09,type:"sine",peak:0.14*v,delay:d});
        noise({dur:0.07,peak:0.07*v,ftype:"lowpass",f0:1500*q,f1:500,delay:d}); }); },
    ring(){ if(!ok()) return; const p=J(1,0.05), v=J(1,0.12);
      osc({f0:660*p,dur:0.38,type:"sine",peak:0.09*v}); osc({f0:990*p,dur:0.48,type:"sine",peak:0.06*v,delay:0.06});
      osc({f0:400,f1:900,dur:0.3,type:"triangle",peak:0.05*v}); }
  };
})();
// ---------- 抽卡翻牌（移植自原版）：牌背依序翻面；稀有＝金色、奇物＝各自主色、垃圾＝灰 ----------
const RARE_REVEAL=new Set(["pistol","shotgun","gold","adrenaline"]);
const tierOf=it=>RARE_REVEAL.has(it)?"rare":(ITEMS[it].sp?"sp":(it==="trash"?"trash":"normal"));
const TIER_LABEL={rare:"稀有",sp:"奇物",trash:"垃圾",normal:"普通"};
function animOff(){ try{ return localStorage.getItem("noDrawAnim")==="1"; }catch(e){ return false; } }
function flipCardHTML(it,i,flipped,extra){
  const t=tierOf(it), col=({food:" food",water:" water",wine:" wine",pill:" pill"})[it]||"";
  return `<div class="flipCard${t==="normal"?"":(t==="sp"?" sp sp-"+(it==="recycle"?"recycledevice":it):" "+t)}${col}${flipped?" flipped":""}${extra||""}" data-i="${i}" title="${esc(ITEMS[it].d||"")}">
    <div class="flipFace flipBack"><div class="flipEmblem"><i>?</i></div></div>
    <div class="flipFace flipFront"><span class="ic">${itemIconHTML(it)}</span><span class="nm">${ITEMS[it].n}</span><span class="tag">${TIER_LABEL[t]}</span></div></div>`;
}
// 依序翻牌；key 用來辨識同一批卡（重繪畫面時不會重播）
function clearFlipTimers(){ if(UI.flip&&UI.flip.timers) UI.flip.timers.forEach(clearTimeout); }
function runFlip(key,items,onDone){
  if(UI.flip && UI.flip.key===key) return;
  clearFlipTimers();
  const F=UI.flip={key,count:0,done:false,timers:[]};
  F.finish=()=>{ if(UI.flip!==F||F.done) return; clearFlipTimers(); F.count=items.length; F.done=true; onDone(); };
  if(animOff()){ F.count=items.length; F.done=true; return; }
  items.forEach((it,i)=>F.timers.push(setTimeout(()=>{
    if(UI.flip!==F||F.done) return;
    F.count=i+1;
    const el=document.querySelector('.flipRow .flipCard[data-i="'+i+'"]'); if(el) el.classList.add("flipped");
    if(RARE_REVEAL.has(it)) SFX.ring(); else SFX.move();
    if(i===items.length-1) F.timers.push(setTimeout(F.finish,600));
  },500+i*650)));
}
function bindFlipOff(){
  const off=$("#flipOff");
  if(off) off.onchange=()=>{ try{ localStorage.setItem("noDrawAnim",off.checked?"1":"0"); }catch(e){} };
}

// ---------- 視窗 ----------
function modal(html){ $("#modalRoot").innerHTML=`<div class="modalbg"><div class="modal">${html}</div></div>`; }
function closeModal(){ UI.modal=null; $("#modalRoot").innerHTML=""; }
function confirmModal(msg,ok){
  modal(`<div>${esc(msg)}</div><div class="row" style="margin-top:12px"><button class="btn" id="cOk">確定</button><button class="btn ghost" id="cNo">取消</button></div>`);
  $("#cOk").onclick=()=>{ closeModal(); ok(); }; $("#cNo").onclick=closeModal;
}
function floorPicker(filter){
  return `<div class="pickgrid">${FLOORS.map((n,f)=>filter(f)?`<div class="pick" data-f="${f}">${n}</div>`:"").join("")}</div>`;
}
function renderModal(){
  const me=G.players[ME], t=me.t;
  // 由狀態決定的視窗優先
  if(G.phase==="action" && t.pending) return drawModal(t.pending);
  if(G.phase==="action" && me.flash && me.flash.r===G.round && me.flash.id!==UI.flashSeen) return flashModal(me.flash);
  if(G.phase==="items" && !t.itemsDone) return itemsModal();
  if(G.phase==="report" && !me.ready) return reportModal();
  if(G.phase!=="action"){ closeModal(); return; }
  if(UI.modal==="tp"){
    modal(`<h3>🌀 傳送到哪一層？（花2步）</h3>${floorPicker(f=>f!==me.floor)}
      <div class="muted" style="font-size:13px">傳送到 B5 可以進入大倉庫。</div><button class="btn ghost" id="mx">取消</button>`);
    document.querySelectorAll(".pick").forEach(e=>e.onclick=()=>{ closeModal(); act("teleport",{floor:+e.dataset.f}); });
  } else if(UI.modal==="rocket"){
    modal(`<h3>🚀 火箭筒要轟炸 ${esc(G.players[1-ME].name)} 大樓的哪一層？</h3>${floorPicker(()=>true)}
      <div class="muted" style="font-size:13px">結算時對方若在那層扣4血。</div><button class="btn ghost" id="mx">取消</button>`);
    document.querySelectorAll(".pick").forEach(e=>e.onclick=()=>{ closeModal(); act("rocket",{floor:+e.dataset.f}); });
  } else if(UI.modal==="ctrl"){
    const mineP=G.poison[ME], blocked=f=>G.poison[1-ME].includes(f)||t.poison===f;
    modal(`<h3>控制室</h3>
      <div><b>解除自己大樓一層毒氣：</b></div>${mineP.length?`<div class="pickgrid">${mineP.map(f=>`<div class="pick" data-m="detox" data-f="${f}">${fl(f)}</div>`).join("")}</div>`:'<div class="muted">你的大樓目前沒有毒氣層</div>'}
      <div style="margin-top:10px"><b>對方大樓多一層毒氣：</b></div>
      <div class="pickgrid">${FLOORS.map((n,f)=>blocked(f)?"":`<div class="pick" data-m="add" data-f="${f}">${n}</div>`).join("")}</div>
      <button class="btn ghost" id="mx">取消</button>`);
    document.querySelectorAll(".pick").forEach(e=>e.onclick=()=>{ closeModal(); act("room",{mode:e.dataset.m,floor:+e.dataset.f}); });
  } else if(UI.modal==="respec"){
    const A=UI.re, total=me.power+me.speed+me.carry, left=total-A.power-A.speed-A.carry;
    const row=(k,l)=>`<div class="statrow"><b>${l}</b><button class="btn small ghost" data-rk="${k}" data-d="-1">−</button><span class="v">${A[k]}</span><button class="btn small ghost" data-rk="${k}" data-d="1">＋</button><span></span></div>`;
    modal(`<h3>操作室：重新分配（共 ${total} 點，剩 ${left}）</h3>${row("power","力量")}${row("speed","速度")}${row("carry","負重")}
      <div class="muted" style="font-size:12px">負重不能低於目前道具數（${me.inv.length}）。本回合剩餘步數不會改變。</div>
      <div class="row" style="margin-top:10px"><button class="btn" id="reOk" ${left?"disabled":""}>確認</button><button class="btn ghost" id="mx">取消</button></div>`);
    document.querySelectorAll("[data-rk]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.rk, d=+b.dataset.d;
      if(d>0&&left<=0) return; if(d<0&&A[k]<=(k==="speed"?1:0)) return;
      A[k]+=d; renderModal();
    });
    $("#reOk").onclick=()=>{ closeModal(); act("room",UI.re); };
  } else { $("#modalRoot").innerHTML=""; return; }
  const mx=$("#mx"); if(mx) mx.onclick=closeModal;
}
function drawModal(pd){
  const me=G.players[ME];
  const key="draw:"+G.round+":"+pd.room+":"+pd.cards.join(",");
  if(UI.drawKey!==key){ UI.drawKey=key; UI.sel=[]; }
  runFlip(key,pd.cards,()=>drawModal(pd));
  const F=UI.flip, done=F.done;
  const pocket=()=>has(me,"dimpocket")||UI.sel.some(i=>pd.cards[i]==="dimpocket");
  const roomLeft=()=>pocket()?Infinity:carryRoom(me)-UI.sel.length;
  const spSel=()=>UI.sel.filter(i=>ITEMS[pd.cards[i]].sp).length;
  const isDump=pd.keep<99;
  const whyNot=i=>{
    const c=pd.cards[i];
    if(ITEMS[c].sp && spSel()>=pd.keep) return "奇物最多只能帶走 "+pd.keep+" 件";
    if(c!=="dimpocket" && roomLeft()<=0) return "負重不足";
    return "";
  };
  const left=roomLeft();
  modal(`<h3>${done?"在「"+ROOMS[pd.room].n+"」搜索到：":"在「"+ROOMS[pd.room].n+"」搜索中…"}</h3>
    <div class="flipRow">${pd.cards.map((c,i)=>flipCardHTML(c,i,i<F.count,done?" pickable"+(UI.sel.includes(i)?" chosen":""):"")).join("")}</div>
    ${done?`<div class="muted" style="font-size:13px">點卡片選擇要帶走的（負重還剩 ${left===Infinity?"∞":left}${isDump?`，奇物最多 ${pd.keep} 件`:""}）；沒選的放回房間。</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="kOk">帶走選取的 ${UI.sel.length} 張</button><button class="btn ghost" id="kAll">盡量全選</button></div>`
    :`<button class="btn small" id="flipSkip">跳過動畫</button>`}
    <label class="muted" style="display:block;margin-top:8px;font-size:12px"><input type="checkbox" id="flipOff" ${animOff()?"checked":""}> 以後不再播放抽卡動畫</label>
    <div class="muted" style="font-size:11px;margin-top:4px">圖示：game-icons.net（CC BY 3.0）</div>`);
  bindFlipOff();
  if(!done){ $("#flipSkip").onclick=F.finish; return; }
  document.querySelectorAll(".flipRow .flipCard").forEach(e=>e.onclick=()=>{
    const i=+e.dataset.i, k=UI.sel.indexOf(i);
    if(k>=0) UI.sel.splice(k,1);
    else { const why=whyNot(i); if(why){ toast(why); return; } UI.sel.push(i); }
    drawModal(pd);
  });
  $("#kAll").onclick=()=>{
    // 依價值大致排序：稀有＞奇物＞普通；垃圾不選
    const rank={rare:0,sp:1,normal:2,trash:3};
    UI.sel=[];
    pd.cards.map((c,i)=>i).sort((a,b)=>rank[tierOf(pd.cards[a])]-rank[tierOf(pd.cards[b])])
      .forEach(i=>{ if(pd.cards[i]!=="trash" && !whyNot(i)) UI.sel.push(i); });
    drawModal(pd);
  };
  $("#kOk").onclick=()=>act("keep",{idx:UI.sel});
}
// 金條多抽／回收裝置：只翻牌展示，按「收下」關閉
function flashModal(fl){
  runFlip("flash:"+fl.id,fl.items,()=>flashModal(fl));
  const F=UI.flip;
  modal(`<h3>${fl.title}${F.done?"：":"…"}</h3>
    <div class="flipRow">${fl.items.map((c,i)=>flipCardHTML(c,i,i<F.count,"")).join("")}</div>
    ${F.done?`<button class="btn" id="flOk">收下</button>`:`<button class="btn small" id="flipSkip">跳過動畫</button>`}
    <label class="muted" style="display:block;margin-top:8px;font-size:12px"><input type="checkbox" id="flipOff" ${animOff()?"checked":""}> 以後不再播放抽卡動畫</label>`);
  bindFlipOff();
  if(!F.done){ $("#flipSkip").onclick=F.finish; return; }
  $("#flOk").onclick=()=>{ UI.flashSeen=fl.id; closeModal(); renderModal(); };
}
function itemsModal(){
  const me=G.players[ME];
  const np=count(me,"pill"), nw=count(me,"wine"), na=count(me,"adrenaline");
  UI.use=UI.use&&UI.use.r===G.round?UI.use:{r:G.round,pill:0,wine:0,adrenaline:false};
  const U=UI.use;
  const est=Math.min(MAXHP,me.hp+U.pill*2);
  modal(`<h3>結算：使用道具</h3>
    <div class="report">${reportLines()}</div>
    <div class="notice" style="margin:10px 0">你目前 HP <b>${me.hp}</b>${me.hp<=0?"　⚠️ 不處理就會死亡！":""}</div>
    ${np?`<div class="statrow"><b>💊藥片</b><button class="btn small ghost" data-u="pill" data-d="-1">−</button><span class="v">${U.pill}</span><button class="btn small ghost" data-u="pill" data-d="1">＋</button><span class="muted">有${np}，每顆+2血</span></div>`:""}
    ${nw?`<div class="statrow"><b>🍷酒</b><button class="btn small ghost" data-u="wine" data-d="-1">−</button><span class="v">${U.wine}</span><button class="btn small ghost" data-u="wine" data-d="1">＋</button><span class="muted">有${nw}，擲骰（1會丟光道具）</span></div>`:""}
    ${na?`<label class="row" style="margin:6px 0"><input type="checkbox" id="uAd" ${U.adrenaline?"checked":""}> 💉 使用腎上腺素（本回合最低保留1血）</label>`:""}
    <div class="muted" style="font-size:13px">順序：藥片 → 酒 → 腎上腺素。用藥後預估 HP ${est}${U.adrenaline?"（腎上腺素保底1）":""}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="uOk">確認</button></div>`);
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.u, d=+b.dataset.d, mx=k==="pill"?np:nw;
    U[k]=Math.max(0,Math.min(mx,U[k]+d)); itemsModal();
  });
  const ad=$("#uAd"); if(ad) ad.onchange=()=>{ U.adrenaline=ad.checked; itemsModal(); };
  $("#uOk").onclick=()=>act("useItems",U);
}
function reportLines(){ return G.report.filter(e=>e.to===undefined||e.to===null||e.to===ME).map(e=>`<div>${esc(e.text)}</div>`).join(""); }
function reportModal(){
  modal(`<h3>${G.round?`第 ${G.round} 回合結算`:"開局遭遇"}</h3><div class="report">${reportLines()}</div>
    <div style="margin-top:12px"><button class="btn" id="rOk">${G.round>=ROUNDS?"查看最終結果":G.round?"準備下一回合":"開始第 1 回合"}</button></div>`);
  $("#rOk").onclick=()=>act("ready");
}
(()=>{ const b=$("#sndBtn"); const upd=()=>{ b.textContent=SFX.isMuted()?"🔇":"🔊"; }; upd(); b.onclick=()=>{ SFX.setMuted(!SFX.isMuted()); upd(); }; })();
render();
</script>
</body>
</html>
